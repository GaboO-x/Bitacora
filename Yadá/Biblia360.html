<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia360 — Pentateuco (Tabla de estudio)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  /* ==========================================================
     SHARED TOKEN SET (app madre) — misma paleta que Verso.
     Claro = default. Mismos nombres de variable que el original
     (--ink, --gold, etc.) para no tocar el resto del CSS.
     ========================================================== */
  :root{
    --ink: #FAF6F1;
    --ink-soft: #FFFFFF;
    --ink-row: #F7F1E8;
    --ink-line: #E8DDD0;
    --parchment: #735A43;
    --gold: #A60321;
    --gold-dim: #E6C9AF;
    --text: #34271F;
    --text-muted: #A08C76;
    --map-overlay-bg: rgba(255,255,255,0.85);
  }

  :root[data-theme="dark"]{
    --ink: #1B1F2E;
    --ink-soft: #242A3D;
    --ink-row: #20263A;
    --ink-line: #333B54;
    --parchment: #E8DFC8;
    --gold: #C9A24B;
    --gold-dim: #8A7239;
    --text: #EDE8DC;
    --text-muted: #9098AC;
    --map-overlay-bg: rgba(27, 31, 46, 0.8);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    overflow: hidden;
  }

  body{
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  header{
    padding: 16px 24px 14px;
    text-align: center;
    border-bottom: 1px solid var(--ink-line);
    flex-shrink: 0;
    position: relative;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: -0.01em;
  }

  .subtitle{
    color: var(--text-muted);
    font-size: 13.5px;
    margin-top: 10px;
  }

  .view-toggle{
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 14px 24px 0;
    flex-shrink: 0;
  }

  .view-toggle button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--ink-line);
    border-radius: 3px;
    padding: 7px 16px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .view-toggle button:hover{
    color: var(--text);
    border-color: var(--gold-dim);
  }

  .view-toggle button.active{
    color: var(--gold);
    border-color: var(--gold);
    background: rgba(201, 162, 75, 0.08);
  }

  .map-wrap{
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 24px 24px;
    overflow: auto;
    flex: 1 1 auto;
    min-height: 0;
    display: none;
    gap: 24px;
  }

  .map-wrap.active{
    display: flex;
  }

  .table-wrap.hidden{
    display: none;
  }

  #leaflet-map{
    flex: 1 1 auto;
    min-width: 320px;
    min-height: 420px;
    background: var(--ink-soft);
    border: 1px solid var(--ink-line);
    border-radius: 6px;
  }

  .geo-marker-icon{
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 9.5px;
    color: var(--ink);
    background: var(--gold);
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(201, 162, 75, 0.15);
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .geo-marker-icon.uncertain{
    color: var(--gold);
    background: var(--ink-soft);
    border-style: dashed;
  }

  .geo-marker-icon.selected{
    box-shadow: 0 0 0 5px rgba(201, 162, 75, 0.35);
  }

  /* Tema oscuro para los controles y popups de Leaflet */
  .leaflet-popup-content-wrapper{
    background: var(--ink-soft);
    color: var(--text);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
  }

  .leaflet-popup-tip{
    background: var(--ink-soft);
  }

  .leaflet-popup-content{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    margin: 10px 12px;
  }

  .leaflet-popup-content strong{
    font-family: 'Fraunces', serif;
    font-size: 15px;
  }

  .leaflet-container a.leaflet-popup-close-button{
    color: var(--text-muted);
  }

  .leaflet-control-zoom a{
    background: var(--ink-soft) !important;
    color: var(--text) !important;
    border-color: var(--ink-line) !important;
  }

  .leaflet-control-attribution{
    background: var(--map-overlay-bg) !important;
    color: var(--text-muted) !important;
  }

  .leaflet-control-attribution a{
    color: var(--text-muted) !important;
  }

  .leaflet-tooltip{
    background: var(--ink-soft) !important;
    color: var(--text) !important;
    border: 1px solid var(--gold-dim) !important;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    box-shadow: none !important;
  }

  .leaflet-tooltip-top:before{
    border-top-color: var(--gold-dim) !important;
  }

  .route-endpoint-icon{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    font-size: 14px;
    line-height: 1;
    background: var(--ink-soft);
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(201, 162, 75, 0.15);
  }

  .geo-distance-label{
    background: var(--ink-soft) !important;
    color: var(--gold) !important;
    border: 1px solid var(--gold-dim) !important;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    box-shadow: none !important;
  }

  .geo-panel{
    flex: 0 0 250px;
    min-width: 220px;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
  }

  .geo-panel-section{
    flex-shrink: 0;
  }

  .geo-panel-section-title{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .geo-chip-list{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .geo-chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text);
    background: var(--ink-soft);
    border: 1px solid var(--ink-line);
    border-radius: 3px;
    padding: 5px 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .geo-chip:hover{
    border-color: var(--gold-dim);
  }

  .geo-chip.active{
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201, 162, 75, 0.08);
  }

  .geo-route-chip{
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .geo-route-swatch{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .mobile-list-toggle{
    display: none;
    width: 100%;
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--gold);
    background: var(--ink-soft);
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .mobile-list-toggle:hover{
    border-color: var(--gold);
  }

  .geo-panel-detail{
    flex: 0 0 340px;
    min-width: 280px;
    max-width: 380px;
    overflow-y: auto;
    padding: 4px 2px;
  }

  .geo-route-distance{
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    background: rgba(201, 162, 75, 0.08);
    border: 1px solid var(--gold-dim);
    border-radius: 3px;
    padding: 3px 9px;
    margin: 6px 0 10px;
  }

  .geo-route-desc{
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 14px;
    line-height: 1.6;
  }

  .geo-waypoint-item{
    display: flex;
    gap: 10px;
    padding: 7px 0;
    border-top: 1px solid var(--ink-line);
    font-size: 13px;
  }

  .geo-waypoint-item:first-child{
    border-top: none;
  }

  .geo-waypoint-num{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    flex-shrink: 0;
    width: 16px;
  }

  .geo-waypoint-note{
    color: var(--text-muted);
    font-size: 12px;
    display: block;
  }

  .geo-clear-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--ink-line);
    border-radius: 3px;
    padding: 4px 10px;
    cursor: pointer;
    margin-bottom: 12px;
  }

  .geo-clear-btn:hover{
    color: var(--text);
    border-color: var(--gold-dim);
  }

  .geo-panel-header{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-bottom: 4px;
  }


  .geo-panel-country{
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    margin-bottom: 14px;
  }

  .geo-panel h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 2px;
  }

  .geo-book-item{
    border-top: 1px solid var(--ink-line);
    padding: 10px 0;
  }

  .geo-book-item:first-child{
    border-top: none;
  }

  .geo-book-item .geo-book-title{
    font-family: 'Fraunces', serif;
    font-size: 14.5px;
    font-weight: 600;
  }

  .geo-book-item .geo-book-meta{
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .geo-uncertain-tag{
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px dashed var(--gold-dim);
    border-radius: 3px;
    padding: 1px 5px;
    margin-left: 6px;
  }

  .geo-legend{
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.8;
  }

  .geo-legend-dot{
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }

  .geo-legend-dot.solid{
    background: var(--gold);
  }

  .geo-legend-dot.dashed{
    background: transparent;
    border: 1.5px dashed var(--gold);
  }

  .geo-unresolved{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--ink-line);
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .geo-unresolved strong{
    color: var(--text);
    font-weight: 600;
  }

  @media (max-width: 900px){
    .map-wrap.active{ flex-direction: column; }
    .geo-panel, .geo-panel-detail{
      max-width: none;
      flex: 0 0 auto;
    }

    /* Estado por defecto: solo lista + "cómo leer el mapa".
       El mapa Leaflet se oculta para ahorrar espacio hasta
       que el usuario selecciona un lugar o recorrido. */
    #leaflet-map{
      display: none;
    }

    /* Estado colapsado (activado desde JS al elegir un lugar
       o recorrido): lista minimizada, mapa + info al 50/50. */
    #map-wrap.mobile-collapsed .geo-col-lists{
      display: none;
    }

    #map-wrap.mobile-collapsed .mobile-list-toggle{
      display: block;
    }

    #map-wrap.mobile-collapsed #leaflet-map{
      display: block;
      flex: 1 1 0;
      min-height: 0;
    }

    #map-wrap.mobile-collapsed .geo-col-detail{
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
    }
  }

  .table-wrap{
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px 24px;
    overflow: auto;
    flex: 1 1 auto;
    min-height: 0;
    border-top: 1px solid var(--ink-line);
  }

  table{
    width: 100%;
    min-width: 1180px;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13.5px;
  }

  thead th{
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    font-weight: 500;
    padding: 24px 14px 12px;
    border-bottom: 1px solid var(--gold-dim);
    position: sticky;
    top: 0;
    background: var(--ink);
    white-space: nowrap;
    z-index: 5;
  }

  thead th.col-book{
    position: sticky;
    left: 0;
    z-index: 6;
    background: var(--ink);
  }

  tbody td{
    padding: 16px 14px;
    border-bottom: 1px solid var(--ink-line);
    vertical-align: top;
    color: var(--text);
  }

  tbody tr:nth-child(even){
    background: var(--ink-row);
  }

  tbody tr:nth-child(even) td.col-book{
    background: var(--ink-row);
  }

  tbody tr:nth-child(odd) td.col-book{
    background: var(--ink);
  }

  td.col-book{
    position: sticky;
    left: 0;
    z-index: 2;
    min-width: 190px;
    border-right: 1px solid var(--ink-line);
  }

  .book-num{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .book-num strong{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--text);
    font-style: normal;
    letter-spacing: normal;
  }

  .book-chapters{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .book-tag{
    font-size: 12px;
    font-style: italic;
    color: var(--parchment);
  }

  .book-date{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .col-connect{
    min-width: 240px;
    color: var(--text-muted);
    font-style: italic;
    font-size: 12.5px;
    line-height: 1.55;
    border-left: 2px solid var(--gold);
  }

  .col-connect strong{
    display:block;
    font-family: 'IBM Plex Mono', monospace;
    font-style: normal;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .col-theme{
    min-width: 200px;
  }

  .col-summary{
    min-width: 140px;
  }

  .video-pill{
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    background: rgba(201, 162, 75, 0.08);
    border: 1px solid var(--gold-dim);
    border-radius: 3px;
    padding: 4px 9px;
    margin: 2px 4px 2px 0;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .video-pill:hover{
    background: rgba(201, 162, 75, 0.18);
    border-color: var(--gold);
  }

  .video-pending{
    color: var(--text-muted);
    font-size: 12px;
  }

  .place-link{
    cursor: pointer;
    text-decoration: underline dotted;
    text-decoration-color: var(--gold-dim);
    text-underline-offset: 3px;
    transition: color 0.15s ease;
  }

  .place-link:hover{
    color: var(--gold);
  }

  .col-characters{
    min-width: 200px;
  }

  .block-row td{
    background: var(--ink-soft) !important;
    border-bottom: 1px solid var(--gold-dim);
    border-top: 1px solid var(--ink-line);
    padding: 14px;
  }

  .block-row .block-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .block-row .block-label span{
    color: var(--text-muted);
    letter-spacing: normal;
    text-transform: none;
    font-style: italic;
  }

  footer{
    text-align: center;
    padding: 14px 20px;
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    border-top: 1px solid var(--ink-line);
    flex-shrink: 0;
  }

  .scroll-hint{
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding: 8px 24px 0;
    display: none;
    flex-shrink: 0;
  }

  @media (max-width: 900px){
    .scroll-hint{ display: block; }
  }

  /* ==========================================================
     VISTA MÓVIL: tarjetas en vez de tabla horizontal.
     Usa los mismos datos (array `blocks`) — no hay contenido
     duplicado a mano, solo un segundo render en JS.
     ========================================================== */
  .book-cards{
    display: none;
    flex-direction: column;
    gap: 14px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 16px 24px;
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
  }

  .book-cards.hidden{
    display: none;
  }

  .card-block-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 6px 2px;
  }

  .card-block-label span{
    color: var(--text-muted);
    letter-spacing: normal;
    text-transform: none;
    font-style: italic;
  }

  .book-card{
    background: var(--ink-soft);
    border: 1px solid var(--ink-line);
    border-radius: 8px;
    padding: 16px;
  }

  .book-card-head{
    padding-bottom: 12px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--gold-dim);
  }

  .book-card-row{
    padding: 9px 0;
    border-bottom: 1px solid var(--ink-line);
  }

  .book-card-row:last-child{
    border-bottom: none;
    padding-bottom: 0;
  }

  .book-card-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-bottom: 3px;
  }

  .book-card-value{
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .book-card-row.connect{
    border-left: 2px solid var(--gold);
    padding-left: 10px;
    background: transparent;
  }

  .book-card-row.connect .book-card-value{
    color: var(--text-muted);
    font-style: italic;
    font-size: 12.5px;
  }

  @media (max-width: 700px){
    .table-wrap, .scroll-hint{
      display: none !important;
    }
    .book-cards:not(.hidden){
      display: flex;
    }
    header{ padding: 12px 18px 10px; }
    .view-toggle{ padding: 12px 18px 0; }
  }
</style>
</head>
<body>

<div class="view-toggle">
  <button id="btn-view-table" class="active" onclick="setView('table')">Tabla</button>
  <button id="btn-view-map" onclick="setView('map')">Mapa</button>
</div>

<p class="scroll-hint">← desliza para ver todas las columnas →</p>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="col-book">Libro</th>
        <th>Lugar de escritura</th>
        <th>País actual</th>
        <th>Período bíblico</th>
        <th class="col-characters">Personajes principales</th>
        <th class="col-theme">Tema principal</th>
        <th class="col-summary">Resumen</th>
        <th class="col-connect">Siguiente libro:</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="book-cards" id="book-cards"></div>

<div class="map-wrap" id="map-wrap">
  <button type="button" class="mobile-list-toggle" id="mobile-list-toggle" onclick="expandMobileList()">☰ Lugares y recorridos</button>
  <div class="geo-panel geo-col-lists" id="geo-panel-lists"></div>
  <div id="leaflet-map"></div>

function tileUrlForTheme(theme) {

        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
}
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('biblia360_theme', theme); } catch(e) {}
    // El mapa se crea de forma diferida (solo al abrir la vista "Mapa"),

    // primer applyTheme() del arranque; el try/catch cubre ese caso.
    try {
        if (leafletMap && mapTileLayer) mapTileLayer.setUrl(tileUrlForTheme(theme));
    } catch(e) {}
}
(function initTheme() {
    let saved = 'light';
    try { saved = localStorage.getItem('biblia360_theme') || 'light'; } catch(e) {}
    applyTheme(saved);
})();

function renderPlaceCell(book){
  const geo = bookGeo[book.title];
  if(geo && geo.region){
    return `<span class="place-link" data-book-title="${book.title}" onclick="goToBookLocation(this.dataset.bookTitle)">${book.writing.place}</span>`;
  }
  return book.writing.place;
}

function renderVideoCell(book){
  const videos = bookVideos[book.title] || [];
  if(videos.length === 0){
    return '<span class="video-pending">—</span>';
  }
  return videos.map((url, i) => `
    <a class="video-pill" href="${url}" target="_blank" rel="noopener noreferrer">
      ▶ ${videos.length > 1 ? 'Parte ' + (i + 1) : 'Resumen'}
    </a>
  `).join('');
}

// Construir listado de libros por región + lista de "sin ubicación"
const allBooksFlat = blocks.flatMap(b => b.books.map(bk => ({ ...bk, blockName: b.name })));
const booksByRegion = {};
const unresolvedBooks = [];

allBooksFlat.forEach(book => {
  const geo = bookGeo[book.title];
  if(!geo || !geo.region){
    unresolvedBooks.push(book);
    return;
  }
  if(!booksByRegion[geo.region]) booksByRegion[geo.region] = [];
  booksByRegion[geo.region].push({ book, uncertain: !!geo.uncertain });
});

let selectedRegion = null;
let selectedRoute = null;
let leafletMap = null;
let mapTileLayer = null;
const leafletMarkers = {};
let routeLayer = null;
let regionHighlightLayer = null;

function renderMap(){
  leafletMap = L.map('leaflet-map', {
    center: [33, 30],
    zoom: 4.4,
    scrollWheelZoom: true,
  });

  // CartoDB Dark Matter / Positron: tiles gratuitos, sin API key, que
  // combinan con el tema activo de la app (los tiles estandar de OSM son
  // a color y no siguen el tema).
  const initialTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  mapTileLayer = L.tileLayer(tileUrlForTheme(initialTheme), {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(leafletMap);

  Object.keys(geoRegions).forEach(key => {
    if(!booksByRegion[key]) return;
    const region = geoRegions[key];
    const entries = booksByRegion[key];
    const total = entries.length;
    const allUncertain = entries.every(e => e.uncertain);
    const size = 14 + Math.sqrt(total) * 3.2;

    const icon = L.divIcon({
      className: '',
      html: `<div class="geo-marker-icon${allUncertain ? ' uncertain' : ''}" style="width:${size}px;height:${size}px">${total}</div>`,
      iconSize: [size, size],
    });

    const marker = L.marker([region.lat, region.lng], { icon }).addTo(leafletMap);
    marker.bindTooltip(region.label, { direction: 'top', offset: [0, -size/2] });
    marker.on('click', () => selectRegion(key));
    leafletMarkers[key] = marker;
  });

  routeLayer = L.layerGroup().addTo(leafletMap);
  regionHighlightLayer = L.layerGroup().addTo(leafletMap);
  renderPanelLists();
}

function setMobileListCollapsed(collapsed){
  const wrap = document.getElementById('map-wrap');
  if(!wrap) return;
  wrap.classList.toggle('mobile-collapsed', collapsed);
  if(collapsed && leafletMap){
    // El contenedor pasa de display:none a visible recién ahora. Hay que
    // recalcular el tamaño de Leaflet ANTES de mover la vista (flyTo/
    // flyToBounds); si se hace después, el destino se calcula sobre un
    // contenedor de tamaño 0 y el movimiento sale mal o no se nota.
    leafletMap.invalidateSize(false);
  }
}

function expandMobileList(){
  if(selectedRegion){ clearRegionSelection(); }
  else if(selectedRoute){ clearRoute(); }
  else { setMobileListCollapsed(false); }
}

function goToRegion(key){
  setMobileListCollapsed(true);
  const region = geoRegions[key];
  leafletMap.flyTo([region.lat, region.lng], 6, { duration: 0.6 });
  selectRegion(key);
}

function goToBookLocation(bookTitle){
  const geo = bookGeo[bookTitle];
  if(!geo || !geo.region) return;

  const wasMapReady = !!leafletMap;
  setView('map');

  // Si el mapa recién se está inicializando en este mismo clic, hay que
  // esperar a que exista antes de centrar la vista.
  if(wasMapReady){
    goToRegion(geo.region);
  } else {
    setTimeout(() => goToRegion(geo.region), 200);
  }
}

function selectRegion(key){
  setMobileListCollapsed(true);
  selectedRegion = key;
  selectedRoute = null;
  routeLayer.clearLayers();
  regionHighlightLayer.clearLayers();

  Object.keys(leafletMarkers).forEach(k => {
    const marker = leafletMarkers[k];
    marker.setOpacity(k === key ? 1 : 0);
    const el = marker.getElement();
    if(el){
      const icon = el.querySelector('.geo-marker-icon');
      if(icon) icon.classList.toggle('selected', k === key);
    }
  });

  const region = geoRegions[key];
  L.circle([region.lat, region.lng], {
    radius: regionRadius[key] || 100000,
    color: '#C9A24B',
    weight: 1.5,
    dashArray: '4,5',
    fillColor: '#C9A24B',
    fillOpacity: 0.08,
  }).addTo(regionHighlightLayer);

  renderPanelLists();
  renderGeoPanel();
}

// Distancia aproximada en línea recta (no la ruta real caminada/navegada,
// que sería más larga) entre dos coordenadas.
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function routeTotalKm(route){
  let total = 0;
  for(let i = 0; i < route.waypoints.length - 1; i++){
    const a = route.waypoints[i], b = route.waypoints[i + 1];
    total += haversineKm(a.lat, a.lng, b.lat, b.lng);
  }
  return total;
}

function showRoute(routeKey){
  setMobileListCollapsed(true);
  selectedRoute = routeKey;
  selectedRegion = null;
  regionHighlightLayer.clearLayers();
  Object.keys(leafletMarkers).forEach(k => {
    leafletMarkers[k].setOpacity(1);
    const el = leafletMarkers[k].getElement();
    if(el){
      const icon = el.querySelector('.geo-marker-icon');
      if(icon) icon.classList.remove('selected');
    }
  });

  routeLayer.clearLayers();
  const route = routes[routeKey];
  const lastIdx = route.waypoints.length - 1;

  // Un segmento de línea por tramo (en vez de una sola polilínea), para
  // poder mostrar la distancia aproximada al pasar el mouse por cada tramo.
  for(let i = 0; i < lastIdx; i++){
    const a = route.waypoints[i], b = route.waypoints[i + 1];
    const km = haversineKm(a.lat, a.lng, b.lat, b.lng);
    const segment = L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
      color: route.color,
      weight: 2.5,
      opacity: 0.85,
      dashArray: '6,6',
    }).addTo(routeLayer);
    segment.bindTooltip(`~${Math.round(km).toLocaleString('es')} km`, { sticky: true, className: 'geo-distance-label' });
  }

  route.waypoints.forEach((w, i) => {
    const isStart = i === 0;
    const isEnd = i === lastIdx;

    if(isStart || isEnd){
      // Ícono fijo y pequeño (🚩/🏁) siempre visible para ubicar de un
      // vistazo dónde empieza y termina; el nombre solo aparece al pasar
      // el mouse, igual que el resto de las paradas.
      const icon = L.divIcon({
        className: '',
        html: `<div class="route-endpoint-icon">${isStart ? '🚩' : '🏁'}</div>`,
        iconSize: [22, 22],
      });
      const marker = L.marker([w.lat, w.lng], { icon }).addTo(routeLayer);
      marker.bindTooltip(`${isStart ? 'Inicio' : 'Fin'}: ${w.name}`, { direction: 'top' });
    } else {
      const marker = L.circleMarker([w.lat, w.lng], {
        radius: 5,
        color: route.color,
        weight: 2,
        fillColor: route.color,
        fillOpacity: 0.9,
      }).addTo(routeLayer);
      marker.bindTooltip(`${i + 1}. ${w.name}`, { direction: 'top' });
    }
  });

  const bounds = L.latLngBounds(route.waypoints.map(w => [w.lat, w.lng]));
  leafletMap.flyToBounds(bounds, { padding: [50, 50], duration: 0.6 });

  renderPanelLists();
  renderGeoPanel();
}

function clearRoute(){
  selectedRoute = null;
  routeLayer.clearLayers();
  renderPanelLists();
  renderGeoPanel();
  setMobileListCollapsed(false);
}

function clearRegionSelection(){
  selectedRegion = null;
  regionHighlightLayer.clearLayers();
  Object.keys(leafletMarkers).forEach(k => {
    leafletMarkers[k].setOpacity(1);
    const el = leafletMarkers[k].getElement();
    if(el){
      const icon = el.querySelector('.geo-marker-icon');
      if(icon) icon.classList.remove('selected');
    }
  });
  renderPanelLists();
  renderGeoPanel();
  setMobileListCollapsed(false);
}

function renderPanelLists(){
  const container = document.getElementById('geo-panel-lists');
  if(!container) return;

  const placesHtml = Object.keys(geoRegions)
    .filter(key => booksByRegion[key])
    .map(key => `
      <button class="geo-chip${selectedRegion === key ? ' active' : ''}" onclick="goToRegion('${key}')">
        ${geoRegions[key].label}
      </button>
    `).join('');

  const routesHtml = Object.keys(routes).map(key => `
    <button class="geo-chip geo-route-chip${selectedRoute === key ? ' active' : ''}" onclick="showRoute('${key}')">
      <span class="geo-route-swatch" style="background:${routes[key].color}"></span>
      ${routes[key].label}
    </button>
  `).join('');

  container.innerHTML = `
    <div class="geo-panel-section">
      <div class="geo-panel-section-title">Lugares</div>
      <div class="geo-chip-list">${placesHtml}</div>
    </div>
    <div class="geo-panel-section">
      <div class="geo-panel-section-title">Recorridos</div>
      <div class="geo-chip-list">${routesHtml}</div>
    </div>
  `;
}

function renderGeoPanel(){
  const panel = document.getElementById('geo-panel-detail');

  if(selectedRoute){
    const route = routes[selectedRoute];
    const totalKm = Math.round(routeTotalKm(route));
    panel.innerHTML = `
      <button class="geo-clear-btn" onclick="clearRoute()">✕ Ocultar recorrido</button>
      <div class="geo-panel-header">Recorrido</div>
      <h3>${route.label}</h3>
      <div class="geo-route-distance">~${totalKm.toLocaleString('es')} km totales</div>
      <div class="geo-route-desc">${route.description}</div>
      ${route.waypoints.map((w, i) => `
        <div class="geo-waypoint-item">
          <div class="geo-waypoint-num">${i + 1}</div>
          <div>
            ${w.name}
            ${w.note ? `<span class="geo-waypoint-note">${w.note}</span>` : ''}
          </div>
        </div>
      `).join('')}
    `;
    return;
  }

  if(!selectedRegion){
    panel.innerHTML = `
      <div class="geo-panel-header">Cómo leer el mapa</div>
      <div class="geo-legend">
        <div><span class="geo-legend-dot solid"></span>Ubicación razonablemente cierta</div>
        <div><span class="geo-legend-dot dashed"></span>Ubicación debatida ("posiblemente...")</div>
        <div style="margin-top:8px">El número indica cuántos libros se escribieron ahí. Tocá un punto, o un nombre de la lista, para ver el detalle.</div>
      </div>
      <div class="geo-unresolved">
        <strong>Sin ubicación determinada:</strong> ${unresolvedBooks.map(b => b.title).join(', ')}. El texto bíblico no lo especifica, así que preferimos no inventar un dato que no existe.
      </div>
    `;
    return;
  }

  const region = geoRegions[selectedRegion];
  const entries = booksByRegion[selectedRegion];

  panel.innerHTML = `
    <button class="geo-clear-btn" onclick="clearRegionSelection()">✕ Ver todos los lugares</button>
    <div class="geo-panel-header">${entries.length} libro${entries.length !== 1 ? 's' : ''} escrito${entries.length !== 1 ? 's' : ''} aquí</div>
    <h3>${region.label}</h3>
    <div class="geo-panel-country">${region.country}</div>
    ${entries.map(e => `
      <div class="geo-book-item">
        <div class="geo-book-title">
          ${String(e.book.order).padStart(2,'0')} · ${e.book.title}
          ${e.uncertain ? '<span class="geo-uncertain-tag">Debatido</span>' : ''}
        </div>
        <div class="geo-book-meta">${e.book.writing.place} · ${e.book.blockName}</div>
      </div>
    `).join('')}
    <div class="geo-unresolved" style="margin-top:14px">
      El círculo del mapa marca una zona aproximada de referencia, no un límite histórico o político preciso.
    </div>
  `;
}

function setView(view){
  const tableWrap = document.querySelector('.table-wrap');
  const cardsWrap = document.getElementById('book-cards');
  const mapWrap = document.getElementById('map-wrap');
  const scrollHint = document.querySelector('.scroll-hint');
  const btnTable = document.getElementById('btn-view-table');
  const btnMap = document.getElementById('btn-view-map');

  if(view === 'map'){
    tableWrap.classList.add('hidden');
    cardsWrap.classList.add('hidden');
    mapWrap.classList.add('active');
    scrollHint.style.display = 'none';
    btnTable.classList.remove('active');
    btnMap.classList.add('active');
    setMobileListCollapsed(false);
    if(!leafletMap) renderMap();
    renderGeoPanel();
    // El contenedor estaba oculto (display:none) al inicializar Leaflet,
    // así que hay que forzar un recálculo de tamaño una vez visible.
    setTimeout(() => leafletMap && leafletMap.invalidateSize(), 50);
  } else {
    tableWrap.classList.remove('hidden');
    cardsWrap.classList.remove('hidden');
    mapWrap.classList.remove('active');
    scrollHint.style.display = '';
    btnMap.classList.remove('active');
    btnTable.classList.add('active');
  }
}
