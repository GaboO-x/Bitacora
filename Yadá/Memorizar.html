<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versículos para Memorizar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ==========================================================
           SHARED TOKEN SET (app madre) — misma paleta en las 3 apps.
           Claro = paleta Adobe Color del usuario (crimson/crema/coral).
           Oscuro = paleta actual de biblia360. No editar los
           --gold / --text / --border de abajo directamente: son alias
           locales de Verso sobre estos tokens, para que el resto del
           CSS del archivo no tuviera que tocarse.
           ========================================================== */
        :root {
    --bg-main: #FAF6F1;
    --card-bg: #FFFFFF;
    --surface-alt: #F7F1E8;

    --border-color: #E8DDD0;
    --border-strong: #DCC9B1;

    --text-primary: #34271F;
    --text-secondary: #735A43;
    --text-muted: #A08C76;

    --accent: #A60321;
    --accent2: #C96E5C;
    --accent-lt: #D9A577;

    --accent-bg: #F8E8E4;
    --accent-hover-bg: #F2D7CF;
    --accent-border: #E6C9AF;

    --green: #3B8B67;
    --green-bg: #EEF8F3;
    --green-border: rgba(59,139,103,.18);
    --green-border-strong: rgba(59,139,103,.35);
    --green-hover-bg: #DDF2E8;

    --red: #C65B4A;
    --red-bg: #FDF0EC;
    --red-border: rgba(198,91,74,.18);
    --red-hover-bg: #F8DDD5;

    --shadow: 0 4px 18px rgba(97,69,44,.06);
    --shadow2: 0 10px 32px rgba(97,69,44,.10);

    --font-sans: 'Inter', sans-serif;
    --font-serif: 'Fraunces', serif;

    /* Alias existentes */
    --bg: var(--bg-main);
    --bg2: var(--card-bg);
    --bg3: var(--surface-alt);

    --gold: var(--accent);
    --gold2: var(--accent2);
    --gold-lt: var(--accent-lt);
    --gold-bg: var(--accent-bg);

    --text: var(--text-primary);
    --text2: var(--text-secondary);
    --text3: var(--text-muted);

    --border: var(--border-color);
    --border2: var(--border-strong);
}

        :root[data-theme="dark"] {
            /* Valores exactos de biblia360: --ink, --ink-soft, --ink-row,
               --ink-line, --gold, --gold-dim, --text, --text-muted.
               accent2/accent-lt/text-secondary son derivados (biblia360
               no los define; Verso necesita mas pasos de los que tiene
               el original) — ver comentario en cada uno. */
            --bg-main:       #1B1F2E;  /* --ink */
            --card-bg:       #242A3D;  /* --ink-soft */
            --surface-alt:   #20263A;  /* --ink-row */
            --border-color:  #333B54;  /* --ink-line */
            --border-strong: #8A7239;  /* --gold-dim, rol real en biblia360: color de borde */

            --text-primary:   #EDE8DC;  /* --text */
            --text-secondary: #B8BFCC;  /* derivado: mezcla de --text y --text-muted */
            --text-muted:     #9098AC;  /* --text-muted */

            --accent:      #C9A24B;  /* --gold */
            --accent2:     #E0BC6E;  /* derivado: gold aclarado, biblia360 no tiene un 2do tono brillante */
            --accent-lt:   #F0D48C;  /* derivado: mas claro aun, para gradientes */
            --accent-bg:   rgba(201,162,75,0.15);
            --accent-hover-bg: rgba(201,162,75,0.24);
            --accent-border:   #8A7239;  /* --gold-dim, mismo uso que en biblia360 */

            --green:      #4CAF7D;
            --green-bg:   rgba(76,175,125,0.12);
            --green-border: rgba(76,175,125,0.35);
            --green-border-strong: rgba(76,175,125,0.45);
            --green-hover-bg: rgba(76,175,125,0.2);
            --red:        #E0685A;
            --red-bg:     rgba(224,104,90,0.12);
            --red-border: rgba(224,104,90,0.35);
            --red-hover-bg: rgba(224,104,90,0.2);

            --shadow:  0 2px 16px rgba(0,0,0,0.35);
            --shadow2: 0 4px 32px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 80px;
        }

        /* ── App header (calcado de biblia360: mismo padding, tipografia y borde) ── */
        .app-header {
            padding: 40px 24px 28px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .app-header h1 {
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: clamp(28px, 6vw, 40px);
            letter-spacing: -0.01em;
            color: var(--text);
        }

        /* ── Tab bar ── */
        .tabbar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .tab {
            padding: 14px 20px;
            font-size: 0.9em; font-weight: 500;
            color: var(--text3); cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s; display: flex; align-items: center; gap: 7px;
            white-space: nowrap;
        }
        .tab:hover { color: var(--text2); }
        .tab.active { color: var(--gold); border-bottom-color: var(--gold2); }

        /* ── Page wrapper ── */
        .page { display: none; max-width: 760px; margin: 0 auto; padding: 24px 16px; }
        .page.active { display: block; }

        /* ── Section title ── */
        .section-title {
            font-family: var(--font-serif);
            font-size: 1.6em; color: var(--text);
            margin-bottom: 6px;
        }
        .section-sub { font-size: 0.88em; color: var(--text3); margin-bottom: 24px; }

        /* ── Modal de confirmación ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 200;
            background: rgba(30, 20, 12, 0.45);
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            max-width: 380px; width: 100%;
            padding: 28px 24px 24px;
            text-align: center;
            box-shadow: var(--shadow2);
        }
        .modal-icon {
            width: 44px; height: 44px; margin: 0 auto 14px;
            border-radius: 50%;
            background: var(--red-bg); color: var(--red);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1em;
        }
        .modal-title {
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: 1.25em;
            color: var(--text);
            margin-bottom: 8px;
        }
        .modal-text {
            font-size: 0.88em;
            color: var(--text3);
            line-height: 1.5;
            margin-bottom: 22px;
        }
        .modal-actions {
            display: flex; gap: 10px;
        }
        .modal-btn {
            flex: 1; padding: 11px 0; border-radius: 10px;
            font-size: 0.88em; font-weight: 600; letter-spacing: 0.02em;
            cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
        }
        .modal-btn-cancel {
            background: transparent; border-color: var(--border); color: var(--text2);
        }
        .modal-btn-cancel:hover { border-color: var(--accent-border); color: var(--gold); }
        .modal-btn-danger {
            background: var(--red); color: #fff;
        }
        .modal-btn-danger:hover { background: var(--gold2); }
        .modal-btn-primary {
            background: var(--gold); color: #fff;
        }
        .modal-btn-primary:hover { background: var(--gold2); }
        .modal-icon-neutral { background: var(--gold-bg); color: var(--gold); }
        .modal-form-fields { text-align: left; margin-bottom: 6px; }

        /* ── Selector de dificultad global (compartido entre Aprender y
           Mis Versículos — misma clase, dos instancias en el DOM) ── */
        .difficulty-selector {
            display: flex; gap: 8px; margin: -12px -16px 20px; padding: 12px 16px;
            position: sticky; top: 0; z-index: 90;
            background: var(--bg); border-bottom: 1px solid var(--border);
        }
        .diff-btn {
            flex: 1; padding: 9px 0; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg2);
            color: var(--text2); font-size: 0.82em; font-weight: 600;
            letter-spacing: 0.02em; cursor: pointer; transition: all 0.2s;
            white-space: nowrap;
        }
        .diff-btn:hover { border-color: var(--accent-border); color: var(--gold); }
        .diff-btn.active {
            background: var(--gold); border-color: var(--gold); color: var(--bg2);
        }
        /* Botón "+Agregar": acento dorado permanente para distinguirlo como
           acción primaria dentro de la misma barra (no es un nivel de dificultad). */
        .diff-btn-accent {
            background: var(--gold-bg); border-color: var(--accent-border); color: var(--gold);
        }
        .diff-btn-accent:hover { background: var(--accent-hover-bg); }
        .diff-btn-accent.open { background: var(--gold); border-color: var(--gold); color: var(--bg2); }

        /* ── Chips de acceso directo a cada versiculo ── */
        .verse-quick-picks { display: flex; gap: 4px; }
        .vq-chip {
            width: 22px; height: 22px; border-radius: 6px;
            background: transparent; border: 1px solid var(--border);
            color: var(--text3); font-size: 0.68em; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .vq-chip:hover { border-color: var(--gold2); color: var(--gold); background: var(--gold-bg); }
        .vq-chip.active {
            background: var(--gold); border-color: var(--gold); color: var(--bg2);
        }
        .vq-chip.mastered {
            background: var(--green); border-color: var(--green); color: var(--bg2);
        }
        .vq-chip.active.mastered {
            background: var(--green); border-color: var(--green); color: var(--bg2);
            box-shadow: 0 0 0 2px var(--gold);
        }

        /* ── Month card ── */
        .month-container {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 14px; margin-bottom: 12px;
            box-shadow: var(--shadow); overflow: hidden;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .month-container:hover { box-shadow: var(--shadow2); border-color: var(--border2); }

        .month-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; cursor: pointer; user-select: none;
        }
        .month-header-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        .month-icon {
            width: 38px; height: 38px; flex-shrink: 0;
            background: var(--gold-bg); border: 1px solid var(--accent-border);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-serif); font-size: 0.78em;
            color: var(--gold); font-weight: 400; letter-spacing: 0.03em;
        }
        .month-info { flex: 1; min-width: 0; }
        .month-name {
            font-weight: 600; font-size: 0.95em; color: var(--text);
            letter-spacing: 0.04em; transition: color 0.2s;
        }
        .month-header:hover .month-name { color: var(--gold); }
        .month-meta { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .month-progress-bar {
            height: 4px; background: var(--border); border-radius: 2px;
            overflow: hidden; flex: 1; max-width: 140px;
        }
        .month-progress-fill {
            height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, var(--gold2), var(--gold-lt));
            transition: width 0.5s ease;
        }
        .month-counter-badge { font-size: 0.76em; color: var(--text3); white-space: nowrap; }

        .month-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .reset-btn {
            width: 30px; height: 30px; border-radius: 50%; background: transparent;
            border: 1px solid var(--border); color: var(--text3); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 0.72em;
            transition: all 0.25s;
        }
        .reset-btn:hover { border-color: var(--gold2); color: var(--gold); transform: rotate(180deg); }
        .chevron { color: var(--text3); font-size: 0.8em; transition: transform 0.3s; }
        .month-container.open .chevron { transform: rotate(180deg); }

        /* ── Panel ── */
        .content { display: none; padding: 0 20px 20px; border-top: 1px solid var(--border); }
        .content.visible { display: block; }

        .panel-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0 12px;
        }
        .verse-counter-label { font-size: 0.82em; color: var(--text3); }
        .diff-pips { display: flex; gap: 4px; }
        .diff-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
        .diff-pip.current { background: var(--gold2); transform: scale(1.3); }
        .diff-pip.mastered { background: var(--green); }
        .diff-pip.current.mastered { box-shadow: 0 0 0 2px var(--green-border); }

        /* ── Verse card ── */
        .verse-display-area { min-height: 160px; display: flex; flex-direction: column; justify-content: center; }

        .verse-card {
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 12px; padding: 22px 22px 18px;
            position: relative; overflow: hidden;
            animation: cardIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .verse-card::before {
            content: '\201C';
            position: absolute; top: 6px; right: 16px;
            font-family: var(--font-serif); font-size: 5em;
            color: var(--gold2); opacity: 0.12; line-height: 1; pointer-events: none;
        }
        .verse-card.slide-out-left  { animation: slideOutLeft  0.28s ease forwards; }
        .verse-card.slide-out-right { animation: slideOutRight 0.28s ease forwards; }

        @keyframes cardIn       { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slideOutLeft  { from{opacity:1;transform:translateX(0) scale(1)} to{opacity:0;transform:translateX(-40px) scale(0.97)} }
        @keyframes slideOutRight { from{opacity:1;transform:translateX(0) scale(1)} to{opacity:0;transform:translateX(40px)  scale(0.97)} }

        .verse-reference {
            font-size: 0.78em; font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--gold); margin-bottom: 12px; display: block;
        }
        .verse-text-wrap {
            font-family: var(--font-serif); font-style: italic;
            font-size: 1.13em; line-height: 1.85; color: var(--text2);
        }

        /* word visible */
        .w-vis { color: var(--text2); }

        /* blank word */
        .w-blank {
            display: inline-block;
            font-style: normal;
            font-family: var(--font-sans);
            font-size: 0.72em; font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--gold);
            background: var(--gold-bg);
            border-bottom: 2px solid var(--gold2);
            border-radius: 3px 3px 0 0;
            padding: 1px 3px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            position: relative; top: -1px;
        }
        .w-blank:hover { background: var(--accent-hover-bg); }
        .w-blank.revealed {
            font-style: italic;
            font-family: var(--font-serif);
            font-size: 1em; font-weight: 400;
            letter-spacing: normal;
            color: var(--gold);
            background: var(--accent-bg);
            border-bottom-color: var(--gold2);
            cursor: default; top: 0; padding: 0 1px;
            animation: wordPop 0.22s ease;
        }
        @keyframes wordPop {
            0%  { transform: scale(0.8); opacity: 0.3; }
            65% { transform: scale(1.07); }
            100%{ transform: scale(1);   opacity: 1; }
        }

        /* hint row */
        .hint-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 12px; gap: 8px; flex-wrap: wrap;
        }
        .reveal-hint { font-size: 0.78em; color: var(--text3); transition: opacity 0.3s; }
        .reveal-hint i { margin-right: 3px; }
        .btn-reveal-all {
            padding: 4px 12px; background: transparent;
            border: 1px solid var(--border2); border-radius: 14px;
            color: var(--gold); cursor: pointer;
            font-family: var(--font-sans); font-size: 0.8em; font-weight: 500;
            transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn-reveal-all:hover { background: var(--gold-bg); }
        .btn-reveal-all.done { opacity: 0; pointer-events: none; }

        /* ── Controls ── */
        .controls { display: flex; gap: 10px; margin-top: 14px; }
        .controls button {
            flex: 1; padding: 12px 16px; border: none; border-radius: 10px; cursor: pointer;
            font-family: var(--font-sans); font-size: 0.95em; font-weight: 600;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .controls button.dont-know {
            background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red);
        }
        .controls button.dont-know:hover { background: var(--red-hover-bg); transform: translateY(-1px); }
        .controls button.know {
            background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green);
        }
        .controls button.know:hover { background: var(--green-hover-bg); transform: translateY(-1px); }
        .controls button:active  { transform: scale(0.98) !important; }
        .controls button:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }

        /* ── Cycle complete ── */
        .cycle-complete {
            text-align: center; padding: 22px 16px; border-radius: 12px;
            background: var(--gold-bg); border: 1px solid var(--accent-border);
            animation: cardIn 0.35s ease forwards;
        }
        .cycle-complete .cc-icon { font-size: 1.6em; color: var(--gold2); margin-bottom: 8px; }
        .cycle-complete .cc-title { font-family: var(--font-serif); font-size: 1.2em; color: var(--text); margin-bottom: 4px; }
        .cycle-complete .cc-sub { font-size: 0.84em; color: var(--text3); margin-bottom: 14px; }
        .cc-stats { display: flex; justify-content: center; gap: 28px; margin-bottom: 16px; }
        .cc-stat .stat-num { font-family: var(--font-serif); font-size: 1.7em; color: var(--text); }
        .cc-stat .stat-num.good { color: var(--green); }
        .cc-stat .stat-num.bad  { color: var(--red); }
        .cc-stat .stat-label { font-size: 0.78em; color: var(--text3); }
        .btn-continue {
            padding: 10px 26px; background: var(--gold2); color: #fff;
            border: none; border-radius: 22px; cursor: pointer;
            font-family: var(--font-sans); font-size: 0.9em; font-weight: 600;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-continue:hover { background: var(--gold); transform: translateY(-1px); }

        /* ── Final completion ── */
        .completion-message {
            text-align: center; padding: 28px 16px; border-radius: 12px;
            background: var(--green-bg); border: 1px solid var(--green-border);
            animation: cardIn 0.35s ease forwards;
        }
        .completion-message .comp-icon { font-size: 2.2em; margin-bottom: 10px; }
        .completion-message .comp-title {
            font-family: var(--font-serif); font-size: 1.4em;
            color: var(--green); margin-bottom: 6px;
        }
        .completion-message .comp-sub { font-size: 0.88em; color: var(--text3); margin-bottom: 18px; }
        .btn-repeat {
            padding: 9px 22px; background: transparent;
            border: 1px solid var(--green-border-strong); border-radius: 22px;
            color: var(--green); cursor: pointer;
            font-family: var(--font-sans); font-size: 0.88em; font-weight: 600;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-repeat:hover { background: var(--green-hover-bg); transform: translateY(-1px); }

        /* ═══════════════════════════════════════
           RANDOM SECTION
        ═══════════════════════════════════════ */
        .random-empty {
            text-align: center; padding: 50px 20px;
            color: var(--text3); font-size: 0.95em;
        }
        .random-empty i { font-size: 2.5em; color: var(--border2); margin-bottom: 14px; display: block; }
        .random-empty p { line-height: 1.6; }

        .random-card-wrap {
            animation: cardIn 0.35s ease forwards;
        }
        .random-verse-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 14px; padding: 28px 28px 22px;
            box-shadow: var(--shadow2); position: relative; overflow: hidden;
            margin-bottom: 20px;
        }
        .random-verse-card::before {
            content: '\201C';
            position: absolute; top: 6px; right: 18px;
            font-family: var(--font-serif); font-size: 6em;
            color: var(--gold2); opacity: 0.08; line-height: 1; pointer-events: none;
        }
        .random-month-chip {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--gold-bg); border: 1px solid var(--accent-border);
            border-radius: 20px; padding: 3px 10px;
            font-size: 0.75em; font-weight: 600; color: var(--gold);
            letter-spacing: 0.04em; margin-bottom: 14px;
        }
        .random-reference {
            font-size: 0.82em; font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text3); margin-bottom: 12px; display: block;
        }
        .random-text {
            font-family: var(--font-serif); font-style: italic;
            font-size: 1.18em; line-height: 1.85; color: var(--text2);
        }
        .random-text .w-blank {
            font-size: 0.7em; top: -2px;
        }
        .random-text .w-blank.revealed {
            font-size: 1em; top: 0;
        }

        .random-controls {
            display: flex; gap: 10px; flex-wrap: wrap;
        }
        .random-controls button {

        .random-hint-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 12px; gap: 8px; flex-wrap: wrap;
        }

        .random-stats {
            display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .rstat {
            background: var(--bg2); border: 1px solid var(--border);

        .my-verse-form {
            display: none;
            background: var(--bg2); border: 1px solid var(--border);

            padding: 12px 16px; border-radius: 10px; cursor: pointer;

        }

            width: 100%; background: transparent; border: 1px dashed var(--border2);

            display: none; flex-direction: column; gap: 8px;
            margin-top: 12px; animation: cardIn 0.25s ease forwards;
        }

        .my-admin-row {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: var(--bg3); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 10px 8px 12px;
        }
        .my-admin-row-text { min-width: 0; font-size: 0.84em; color: var(--text2); line-height: 1.4; }
        .my-admin-row-text strong { display: block; color: var(--gold); font-size: 0.92em; margin-bottom: 1px; }

        }
        .my-admin-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .my-admin-btn {
            width: 28px; height: 28px; border-radius: 8px;
            background: transparent; border: 1px solid var(--border);
            color: var(--text3); cursor: pointer; font-size: 0.78em;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .my-admin-btn:hover { border-color: var(--gold2); color: var(--gold); background: var(--gold-bg); }
        .my-admin-btn-danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }

        /* ── Responsive ── */
        @media (max-width: 580px) {
            .tabbar { padding: 0 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .tab { padding: 13px 12px; font-size: 0.83em; }
        }
        @media (max-width: 400px) {
            .tab { padding: 12px 9px; font-size: 0.78em; gap: 5px; }
            .page { padding: 18px 12px; }
            .month-header { padding: 14px 14px; }
            .content { padding: 0 14px 16px; }
            .verse-text-wrap, .random-text { font-size: 1.05em; }
            .controls button, .random-controls button { padding: 11px 10px; font-size: 0.88em; }
        }
    </style>
</head>
<body>

<!-- App header (mismo tratamiento que el h1 de biblia360: Fraunces centrado + linea inferior) -->

<!-- Tab bar -->

    </div>

<!-- LEARN PAGE -->

<div class="page" id="page-mine">

        <button class="diff-btn" data-level="1" onclick="setDifficulty(1)">Fácil</button>
        <button class="diff-btn" data-level="2" onclick="setDifficulty(2)">Medio</button>

<!-- RANDOM PAGE -->
<div class="page" id="page-random">

<script>
// ═══════════════════════════════════════════
// TEMA: controlado 100% por la app madre via postMessage
// (sin botón/control local; ver listener 'message' abajo)
// ═══════════════════════════════════════════
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('verso_theme', theme); } catch(e) {}
}
(function initTheme() {
    let saved = 'light';
    try { saved = localStorage.getItem('verso_theme') || 'light'; } catch(e) {}
    applyTheme(saved);
})();
// Tema controlado 100% desde la app madre (sidebar):
window.addEventListener('message', (event) => {
    const data = event.data;
    if (data && data.action === 'setTheme' && (data.theme === 'light' || data.theme === 'dark')) {
        applyTheme(data.theme);
    }
});

// ═══════════════════════════════════════════
// DIFICULTAD GLOBAL (reemplaza la progresion automatica por ciclos:
// el usuario elige el nivel directamente y se aplica a todos los meses)
// ═══════════════════════════════════════════
let practiceDifficulty = 1;

function setDifficulty(level) {
    practiceDifficulty = level;
    try { localStorage.setItem('verso_difficulty', String(level)); } catch(e) {}
    // Por clase (no por ID): así ambas barras — Aprender y Mis Versículos —
    // quedan sincronizadas, son el mismo control compartido en 2 lugares.
    document.querySelectorAll('.practice-diff-selector .diff-btn[data-level]')
        .forEach(b => b.classList.toggle('active', Number(b.dataset.level) === level));
    // el dominio por chip depende de la dificultad activa, se actualiza en TODOS los meses
    // (esten abiertos o no, porque los chips se ven igual en el header colapsado)
    for (const id in versesData) updateVerseChipMastery(id);
    for (const id in getMySections()) updateVerseChipMastery(id);
    // re-renderizar cualquier mes actualmente abierto para que pips/nivel tambien se vean al toque
    document.querySelectorAll('.month-container.open').forEach(mc => {
        const id = mc.id.replace('mc-','');
        if (getState(id)) renderCurrent(id);
    });
}

function updateQuickPicks(id, activeIdx) {
    const chips = document.querySelectorAll(`#mc-${id} .vq-chip`);
    chips.forEach((chip,i) => chip.classList.toggle('active', i===activeIdx));
}

function updateVerseChipMastery(id) {
    const st = getState(id);
    if (!st) return;
    document.querySelectorAll(`#mc-${id} .vq-chip`).forEach((chip,i) => {
        chip.classList.toggle('mastered', !!(st.mastered[i] && st.mastered[i][practiceDifficulty]));
    });
}

function jumpToVerse(id, verseIdx) {
    const st = getState(id);
    const n = getVerses(id).length;
    st.completed = false; // permite revisar un verso puntual aunque el mes ya este dominado
    // rota la cola completa arrancando en el verso elegido: 3,4,1,2 si eligen el 3
    st.queue = Array.from({length:n}, (_,k) => (verseIdx+k) % n);
    st.cycleKnown = 0; // arranca un ciclo nuevo desde el punto elegido
    const mc = document.getElementById(`mc-${id}`);
    if (!mc.classList.contains('open')) {
        mc.classList.add('open');
        document.getElementById(`panel-${id}`).classList.add('visible');
    }
    renderCurrent(id);
}

// ═══════════════════════════════════════════
// TEXT HELPERS
// ═══════════════════════════════════════════
function wordLetterCount(w) { return w.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ]/g,'').length || w.length; }
function makeBlank(w) { return '_'.repeat(Math.max(wordLetterCount(w),1)); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function cleanWord(w) { return w.replace(/[^a-zA-Z\u00C0-\u024F]/g,'').toLowerCase(); }
function isSkippable(w) { return SKIP_WORDS.has(cleanWord(w)) || cleanWord(w).length <= 2; }

function chooseHiddenIndices(words, level) {
    const n = words.length;
    if (level === 1) return new Set();
    if (level === 3) {
        // Hide everything after first LEVEL_LAST_VISIBLE words
        const s = new Set();
        for (let i = LEVEL_LAST_VISIBLE; i < n; i++) s.add(i);
        return s;
    }
    // Level 2: hide ~50% but only meaningful words (not connectors/monosyllables)
    // Build pool of "hideable" indices (skip word 0 and skip-list words)
    const pool = [];
    for (let i = 1; i < n; i++) {
        if (!isSkippable(words[i])) pool.push(i);
    }
    // If not enough meaningful words, fall back to all non-skip words
    shuffleArr(pool);
    const target = Math.max(1, Math.round(n * 0.50));
    // Take up to target from pool; if pool too small, pad with any remaining words
    const chosen = new Set(pool.slice(0, target));
    return chosen;
}

function buildVerseHTML(text, level) {
    const words = text.split(' ');
    const hidden = chooseHiddenIndices(words, level);
    return words.map((w,i) => hidden.has(i)
        ? `<span class="w-blank" data-word="${esc(w)}" onclick="revealWord(this)">${makeBlank(w)}</span>`
        : `<span class="w-vis">${esc(w)}</span>`
    ).join(' ');
}

function revealWord(el) {
    if (el.classList.contains('revealed')) return;
    el.classList.add('revealed');
    el.textContent = el.dataset.word;
    el.onclick = null;
    checkAllRevealed(el.closest('[data-card]') || el.closest('.verse-card') || el.closest('.random-verse-card'));
}

function revealAll(btn) {
    const card = btn.closest('[data-card]') || btn.closest('.verse-card') || btn.closest('.random-verse-card');
    if (!card) return;
    card.querySelectorAll('.w-blank:not(.revealed)').forEach(el => {
        el.classList.add('revealed'); el.textContent = el.dataset.word; el.onclick = null;
    });
    checkAllRevealed(card);
}

function checkAllRevealed(card) {
    if (!card) return;
    if (card.querySelectorAll('.w-blank:not(.revealed)').length === 0) {
        const hint = card.querySelector('.reveal-hint');
        const btn  = card.querySelector('.btn-reveal-all');
        if (hint) hint.style.opacity = '0';
        if (btn)  btn.classList.add('done');
    }
}

function shuffleArr(a) {
    for (let i=a.length-1;i>0;i--) {
        const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
    }
}

// ═══════════════════════════════════════════
// MIS VERSÍCULOS — DATOS Y PERSISTENCIA
// (localStorage por ahora; misma clave-prefijo "verso_" que el resto.
//  Preparado para migrar a nube sin tocar la forma de los datos: solo
//  cambiaría saveMyVerses/loadMyVerses por llamadas a un backend.)
// ═══════════════════════════════════════════
const MY_VERSES_KEY   = 'verso_myverses_v1';
const MY_SECTION_SIZE = 4; // igual que los meses: 4 versículos por tarjeta

let myVerses = []; // [{ id, cita, texto }] — orden de carga = orden de secciones

function genMyVerseId() {
    return 'mv_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function saveMyVerses() {
    try { localStorage.setItem(MY_VERSES_KEY, JSON.stringify(myVerses)); } catch (e) {}
}

function loadMyVerses() {
    try {
        const raw = localStorage.getItem(MY_VERSES_KEY);
        myVerses = raw ? JSON.parse(raw) : [];
    } catch (e) { myVerses = []; }
}

// Agrupa myVerses en bloques de 4, con el mismo shape que versesData[mes]
// ({text, reference}) para poder reutilizar el motor de práctica existente.
// Se recalcula siempre desde myVerses (nunca queda guardado por separado),
// así que agregar/editar/eliminar nunca deja "huecos" entre secciones.
function getMySections() {
    const sections = {};
    for (let i = 0; i < myVerses.length; i += MY_SECTION_SIZE) {
        const secNum = Math.floor(i / MY_SECTION_SIZE) + 1;
        const secId  = `my_${secNum}`;
        sections[secId] = myVerses.slice(i, i + MY_SECTION_SIZE)
            .map(v => ({ text: v.texto, reference: v.cita, _uid: v.id }));
    }
    return sections;
}

// "SECCIÓN 01", "SECCIÓN 02"... (mismo tratamiento visual que MONTH_NAME)
function mySectionLabel(secId) {
    const num = secId.split('_')[1];
    return `Sección ${String(num).padStart(2, '0')}`;
}
function mySectionAbbr(secId) {
    return String(secId.split('_')[1]).padStart(2, '0');
}

// ── CRUD ──────────────────────────────────
function addMyVerse(cita, texto) {
    cita = (cita || '').trim();
    texto = (texto || '').trim();
    if (!cita || !texto) return null;
    const verse = { id: genMyVerseId(), cita, texto };
    myVerses.push(verse);
    saveMyVerses();
    return verse;
}

function editMyVerse(id, cita, texto) {
    const v = myVerses.find(v => v.id === id);
    if (!v) return false;
    if (cita !== undefined)  v.cita  = cita.trim();
    if (texto !== undefined) v.texto = texto.trim();
    saveMyVerses();
    // El progreso vive ligado a "id", no a la posición: editar cita/texto
    // nunca toca ni resetea el avance de memorización de este versículo.
    return true;
}

function deleteMyVerse(id) {
    const idx = myVerses.findIndex(v => v.id === id);
    if (idx === -1) return false;
    myVerses.splice(idx, 1);
    saveMyVerses();
    // Limpieza: borra también el progreso de ESE id puntual.
    // El resto de los versículos no se toca ni se resetea, aunque
    // cambien de sección/posición al recalcularse getMySections().
    delete myProgress[id];
    saveMyProgress();
    // También borra su marca de Disponible/Aprendido/Repasar en Aleatorio
    // (la clave "myv::id" es estable, no depende de la posición).
    delete verseMarks[`myv::${id}`];
    saveVerseMarks();
    return true;
}

// ═══════════════════════════════════════════
// MIS VERSÍCULOS — PROGRESO LIGADO A "id" (no a posición)
// Guardar el avance por id (en vez de por índice dentro de la sección,
// como monthState) es lo que hace que agregar/editar/eliminar versículos
// nunca mezcle ni borre el progreso de otro versículo, aunque las
// secciones se recalculen y las posiciones se corran.
// ═══════════════════════════════════════════
const MY_PROGRESS_KEY = 'verso_myverses_progress_v1';

let myProgress = {}; // { [verseId]: { curLevel, nextLevel, mastered:{1,2,3} } }

function makeVerseProgress() {
    return { curLevel: 1, nextLevel: 1, mastered: { 1: false, 2: false, 3: false } };
}

// Devuelve (y crea si no existe) el progreso de un versículo puntual
function getVerseProgress(id) {
    if (!myProgress[id]) myProgress[id] = makeVerseProgress();
    return myProgress[id];
}

function saveMyProgress() {
    try { localStorage.setItem(MY_PROGRESS_KEY, JSON.stringify(myProgress)); } catch (e) {}
}

function loadMyProgress() {
    try {
        const raw = localStorage.getItem(MY_PROGRESS_KEY);
        myProgress = raw ? JSON.parse(raw) : {};
    } catch (e) { myProgress = {}; }
}

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let monthState = {};

function makeState(id) {
    const n = versesData[id].length;
    const curLevel={}, nextLevel={}, mastered={};
    for (let i=0;i<n;i++) { curLevel[i]=nextLevel[i]=1; mastered[i]={1:false,2:false,3:false}; }
    return { queue:[...Array(n).keys()], curLevel, nextLevel, mastered, cycleKnown:0, completed:false };
}

// ═══════════════════════════════════════════
// CAPA COMÚN: el motor de práctica (renderCurrent, mark, toggleMonth,
// jumpToVerse, showCycleEnd, etc.) trabaja contra estas 3 funciones en
// vez de leer versesData/monthState directo. Así, un mismo motor sirve
// tanto para los meses fijos como para las secciones de "Mis Versículos",
// sin duplicar la lógica de práctica.
// ═══════════════════════════════════════════
function isMineId(id) { return typeof id === 'string' && id.startsWith('my_'); }

function getVerses(id) {
    return isMineId(id) ? (getMySections()[id] || []) : versesData[id];
}

// Sesión en memoria de las secciones "mine" (se reconstruye a partir de
// myProgress, que es lo único persistido de verdad por id de versículo).
let mySectionState = {};

function makeMyState(id) {
    const verses = getVerses(id);
    const n = verses.length;
    const curLevel={}, nextLevel={}, mastered={};
    for (let i=0;i<n;i++) {
        const p = getVerseProgress(verses[i]._uid);
        curLevel[i]=p.curLevel; nextLevel[i]=p.nextLevel; mastered[i]=p.mastered;
    }
    return { queue:[...Array(n).keys()], curLevel, nextLevel, mastered, cycleKnown:0, completed:false };
}

function getState(id) {
    if (isMineId(id)) {
        if (!mySectionState[id]) mySectionState[id] = makeMyState(id);
        return mySectionState[id];
    }
    return monthState[id];
}

// Guarda el estado según a quién pertenece: meses -> verso_v7 (como siempre);
// secciones propias -> se traduce de vuelta a myProgress (por id de versículo,
// no por posición) y se guarda en verso_myverses_progress_v1.
function persistState(id) {
    if (isMineId(id)) {
        const st = mySectionState[id];
        const verses = getVerses(id);
        if (!st) return;
        verses.forEach((v,i) => {
            const p = getVerseProgress(v._uid);
            p.curLevel  = st.curLevel[i];
            p.nextLevel = st.nextLevel[i];
            p.mastered  = st.mastered[i];
        });
        saveMyProgress();
    } else {
        saveState();
    }
}

// ═══════════════════════════════════════════
// MARCAS UNIFICADAS: Disponible / Aprendido / Repasar
// Un solo store para las 3 pestañas (Aprender, Mis Versículos, Aleatorio):
// marcar "Lo sé" en CUALQUIER modo pasa ese versículo a Aprendido, y
// "No lo sé" lo pasa a Repasar. "Disponible" es la unión de ambos —
// todo versículo que ya practicaste al menos una vez, en cualquier modo.
// Persiste en localStorage (no hay botón "Guardar" en la app: cada clic
// se guarda solo). La clave es "idDeSección::índiceDelVersículo" — sirve
// tanto para meses como para secciones propias porque getVerses(id) ya
// sabe resolver ambos casos (ver capa común más arriba).
// ═══════════════════════════════════════════
const VERSE_MARKS_KEY = 'verso_verse_marks_v1';
let verseMarks = {}; // { key: 'aprendido' | 'repasar' } — ver verseMarkKey() para el formato de key

// Para meses (fijos, nunca cambian de posición): "monthId::índice".
// Para "Mis Versículos" (la lista puede reordenarse al eliminar otro
// versículo): "myv::idDelVersículo" — clave estable ligada al versículo
// mismo, no a dónde está sentado hoy dentro de su sección.
function verseMarkKey(id, verseIdx) {
    if (isMineId(id)) {
        const v = getVerses(id)[verseIdx];
        if (v && v._uid) return `myv::${v._uid}`;
    }
    return `${id}::${verseIdx}`;
}

function saveVerseMarks() {
    try { localStorage.setItem(VERSE_MARKS_KEY, JSON.stringify(verseMarks)); } catch (e) {}
}

function loadVerseMarks() {
    try {
        const raw = localStorage.getItem(VERSE_MARKS_KEY);
        verseMarks = raw ? JSON.parse(raw) : {};
    } catch (e) { verseMarks = {}; }
}

// Llamar desde CUALQUIER lugar donde se marque "Lo sé"/"No lo sé":
// mark() (Aprender + Mis Versículos) y markRandom() (Aleatorio).
function setVerseMark(id, verseIdx, knew) {
    verseMarks[verseMarkKey(id, verseIdx)] = knew ? 'aprendido' : 'repasar';
    saveVerseMarks();
}

// Reconstruye un versículo marcado a partir de su clave. Si el versículo
// ya no existe (p. ej. se eliminó de "Mis Versículos"), devuelve null y
// se descarta solo — no hace falta limpiar la marca a mano.
function resolveMarkedItem(key) {
    if (key.startsWith('myv::')) {
        const uid = key.slice(5);
        const sections = getMySections();
        for (const secId in sections) {
            const idx = sections[secId].findIndex(v => v._uid === uid);
            if (idx !== -1) {
                const v = sections[secId][idx];
                return { monthId: secId, verseIdx: idx, text: v.text, reference: v.reference, monthName: mySectionLabel(secId) };
            }
        }
        return null; // el versículo fue eliminado
    }
    const sep = key.lastIndexOf('::');
    if (sep === -1) return null;
    const id = key.slice(0, sep);
    const verseIdx = Number(key.slice(sep + 2));
    const verses = getVerses(id);
    const v = verses && verses[verseIdx];
    if (!v) return null;
    return { monthId: id, verseIdx, text: v.text, reference: v.reference, monthName: monthNames[id] };
}

// status: 'aprendido' | 'repasar' | null (null = todos, "Disponible")
function getMarkedVerses(status) {
    const result = [];
    for (const key in verseMarks) {
        if (status && verseMarks[key] !== status) continue;
        const item = resolveMarkedItem(key);
        if (item) result.push(item);
    }
    return result;
}

// ── Random session state ──────────────────
let randomQueue      = [];   // shuffled pool actualmente activo (según randomFilter)
let randomPointer    = 0;
let randomDifficulty = 3;    // Difícil por defecto cada vez que se entra a Aleatorio
let randomFilter     = 'disponible'; // 'disponible' | 'aprendido' | 'repasar'

// El pool activo depende de qué botón (Disponible/Aprendido/Repasar) está
// seleccionado — así el usuario elige específicamente qué repasar.
function currentRandomPool() {
    if (randomFilter === 'aprendido') return getMarkedVerses('aprendido');
    if (randomFilter === 'repasar')   return getMarkedVerses('repasar');
    return getMarkedVerses(null); // 'disponible' = aprendido ∪ repasar
}

function buildRandomQueue() {
    randomQueue = [...currentRandomPool()];
    shuffleArr(randomQueue);
    randomPointer = 0;
}

function setRandomFilter(filter) {
    randomFilter = filter;
    document.querySelectorAll('.rstat').forEach(el => {
        el.classList.toggle('active', el.dataset.filter === filter);
    });
    buildRandomQueue();
    renderRandomVerse();
}

function setRandomDifficulty(level) {
    randomDifficulty = level;
    document.querySelectorAll('#difficulty-selector-random .diff-btn[data-level]')
        .forEach(b => b.classList.toggle('active', Number(b.dataset.level) === level));
    renderRandomVerse();
}

function randomEmptyMessage() {
    if (randomFilter === 'aprendido') return 'Todavía no marcaste ningún versículo como "Lo sé".';
    if (randomFilter === 'repasar')   return 'Todavía no tenés versículos marcados para repasar.';
    return 'Aún no marcaste versículos.<br>Marca "Lo sé" o "No lo sé" en Aprender, Mis Versículos o acá mismo para que aparezcan.';
}

// ═══════════════════════════════════════════
// TAB SWITCHING
// ═══════════════════════════════════════════
function showTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`page-${tab}`).classList.add('active');
    if (tab === 'random') initRandomPage();
    if (tab === 'mine') buildMyUI();
}

// ═══════════════════════════════════════════
// MIS VERSÍCULOS — FORMULARIO DE CARGA (colapsable)
// ═══════════════════════════════════════════
// Abre/cierra el formulario de carga. Se activa con el botón "+Agregar"
// de la barra compartida y se cierra solo (forceState=false) al guardar,
// para no ocupar espacio en pantalla el resto del tiempo.
function toggleAddForm(forceState) {
    const form  = document.getElementById('my-verse-form');
    const btn   = document.getElementById('add-toggle-btn');
    const label = btn.querySelector('.btn-label');
    const icon  = btn.querySelector('i');
    const shouldOpen = typeof forceState === 'boolean' ? forceState : !form.classList.contains('open');

    form.classList.toggle('open', shouldOpen);
    btn.classList.toggle('open', shouldOpen);
    if (label) label.textContent = shouldOpen ? 'Cerrar' : 'Agregar';
    if (icon)  icon.className = shouldOpen ? 'fas fa-xmark' : 'fas fa-plus';

    if (shouldOpen) {
        document.getElementById('mv-cita').focus();
    } else {
        document.getElementById('mv-cita').value = '';
        document.getElementById('mv-texto').value = '';
        document.getElementById('mv-error').textContent = '';
    }
}

function handleAddMyVerse() {
    const citaEl  = document.getElementById('mv-cita');
    const textoEl = document.getElementById('mv-texto');
    const errEl   = document.getElementById('mv-error');

    const cita  = citaEl.value.trim();
    const texto = textoEl.value.trim();
    errEl.textContent = '';

    if (!cita || !texto) {
        errEl.textContent = 'Completa la cita y el texto del versículo.';
        (!cita ? citaEl : textoEl).focus();
        return;
    }
    if (cita.length > 60) {
        errEl.textContent = 'La cita es demasiado larga (máx. 60 caracteres).';
        citaEl.focus();
        return;
    }

    const verse = addMyVerse(cita, texto);
    if (!verse) {
        errEl.textContent = 'No se pudo agregar el versículo. Intenta de nuevo.';
        return;
    }

    // Un versículo nuevo puede crear una sección nueva o sumarse a la última
    // sección parcial existente: invalida la caché de sesión para que las
    // posiciones se recalculen limpias contra la composición actual.
    mySectionState = {};

    buildMyUI();
    toggleAddForm(false); // limpia campos y colapsa la vista al botón
}

// ═══════════════════════════════════════════
// MIS VERSÍCULOS — EDITAR / ELIMINAR (Paso 5)
// ═══════════════════════════════════════════
function toggleAdminList(id) {
    const list = document.getElementById(`admin-list-${id}`);
    if (list) list.classList.toggle('open');
}

// ── Editar ──
let editingVerseId = null;

function openEditMyVerse(uid) {
    const v = myVerses.find(v => v.id === uid);
    if (!v) return;
    editingVerseId = uid;
    document.getElementById('edit-mv-cita').value = v.cita;
    document.getElementById('edit-mv-texto').value = v.texto;
    document.getElementById('edit-mv-error').textContent = '';
    document.getElementById('edit-verse-modal-overlay').classList.add('open');
}

function closeEditVerseModal() {
    document.getElementById('edit-verse-modal-overlay').classList.remove('open');
    editingVerseId = null;
}

function confirmEditMyVerse() {
    if (!editingVerseId) return;
    const citaEl  = document.getElementById('edit-mv-cita');
    const textoEl = document.getElementById('edit-mv-texto');
    const errEl   = document.getElementById('edit-mv-error');

    const cita  = citaEl.value.trim();
    const texto = textoEl.value.trim();
    errEl.textContent = '';

    if (!cita || !texto) {
        errEl.textContent = 'Completa la cita y el texto del versículo.';
        return;
    }
    if (cita.length > 60) {
        errEl.textContent = 'La cita es demasiado larga (máx. 60 caracteres).';
        return;
    }

    editMyVerse(editingVerseId, cita, texto);
    // El id no cambia, así que el progreso (mastered/chips) sigue intacto;
    // no hace falta invalidar mySectionState aquí.
    closeEditVerseModal();
    buildMyUI();
}

// ── Eliminar ──
let deletingVerseId = null;

function requestDeleteMyVerse(uid) {
    const v = myVerses.find(v => v.id === uid);
    if (!v) return;
    deletingVerseId = uid;
    document.getElementById('delete-verse-text').textContent =
        `Se eliminará "${v.cita}" y su progreso de memorización. Esta acción no se puede deshacer.`;
    document.getElementById('delete-verse-modal-overlay').classList.add('open');
}

function closeDeleteVerseModal() {
    document.getElementById('delete-verse-modal-overlay').classList.remove('open');
    deletingVerseId = null;
}

function confirmDeleteMyVerse() {
    if (!deletingVerseId) return;
    deleteMyVerse(deletingVerseId);
    // Eliminar corre posiciones dentro/entre secciones: invalida la caché
    // de sesión para forzar reconstrucción limpia desde myProgress (por id).
    mySectionState = {};
    closeDeleteVerseModal();
    buildMyUI();
}

// ═══════════════════════════════════════════
// BUILD LEARN UI
// ═══════════════════════════════════════════
// Plantilla de tarjeta compartida: la usan tanto los meses fijos como
// las secciones de "Mis Versículos" (Paso 4), para que ambas corran
// sobre el mismo motor de práctica (toggleMonth/renderCurrent/mark/...).
function renderSectionCard(container, id, verses, label, abbr, resetTitle) {
    const el = document.createElement('div');
    el.className = 'month-container';
    el.id = `mc-${id}`;

    // Bloque de editar/eliminar — solo existe en secciones "Mis Versículos".
    // Los meses fijos (versículos de la Biblia) no se pueden editar/borrar.
    const adminBlock = isMineId(id) ? `
        <div class="my-admin">
          <button type="button" class="my-admin-toggle" onclick="event.stopPropagation();toggleAdminList('${id}')">
            <i class="fas fa-pen-to-square"></i> Editar o eliminar versículos de esta sección
          </button>
          <div class="my-admin-list" id="admin-list-${id}">
            ${verses.map(v => `
              <div class="my-admin-row">
                <div class="my-admin-row-text">
                  <strong>${esc(v.reference)}</strong>
                  <span>${esc(v.text.length > 60 ? v.text.slice(0,60) + '…' : v.text)}</span>
                </div>
                <div class="my-admin-row-actions">
                  <button type="button" class="my-admin-btn" onclick="event.stopPropagation();openEditMyVerse('${v._uid}')" title="Editar">
                    <i class="fas fa-pen"></i>
                  </button>
                  <button type="button" class="my-admin-btn my-admin-btn-danger" onclick="event.stopPropagation();requestDeleteMyVerse('${v._uid}')" title="Eliminar">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>`).join('')}
          </div>
        </div>` : '';

    el.innerHTML = `
      <div class="month-header" onclick="toggleMonth('${id}')">
        <div class="month-header-left">
          <div class="month-icon">${abbr}</div>
          <div class="month-info">
            <div class="month-name">${label.toUpperCase()}</div>
          </div>
        </div>
        <div class="month-header-right">
          <div class="verse-quick-picks">
            ${verses.map((_,i)=>`<button class="vq-chip" onclick="event.stopPropagation();jumpToVerse('${id}',${i})" title="Ir directo al versículo ${i+1}">${i+1}</button>`).join('')}
          </div>
          <button class="reset-btn" onclick="event.stopPropagation();resetMonth('${id}')" title="${resetTitle}">
            <i class="fas fa-redo"></i>
          </button>
          <i class="fas fa-chevron-down chevron"></i>
        </div>
      </div>
      <div id="panel-${id}" class="content">
        <div class="panel-topbar">
          <span class="verse-counter-label" id="vc-${id}"></span>
          <div class="diff-pips" id="dp-${id}">
            <div class="diff-pip"></div><div class="diff-pip"></div>
            <div class="diff-pip"></div>
          </div>
        </div>
        <div class="verse-display-area" id="da-${id}"></div>
        <div class="controls">
          <button class="dont-know" id="no-${id}" onclick="mark('${id}',false)">
            <i class="fas fa-times"></i> No lo sé
          </button>
          <button class="know" id="yes-${id}" onclick="mark('${id}',true)">
            <i class="fas fa-check"></i> Lo sé
          </button>
        </div>
        ${adminBlock}
      </div>`;
    container.appendChild(el);
}

function buildUI() {
    const wrap = document.getElementById('months-wrapper');
    wrap.innerHTML = '';
    for (const id in versesData) {
        renderSectionCard(wrap, id, versesData[id], monthNames[id], monthAbbr[id], 'Reiniciar progreso de este mes');
    }
}

// Construye las tarjetas de "Mis Versículos" (una por sección de 4).
// Se reconstruye cada vez que se abre la pestaña o se agrega un versículo,
// porque a diferencia de los meses, esta lista cambia en vivo.
function buildMyUI() {
    const wrap = document.getElementById('my-sections-wrapper');
    if (!wrap) return;
    wrap.innerHTML = '';
    const sections = getMySections();
    const ids = Object.keys(sections);

    if (ids.length === 0) {
        wrap.innerHTML = `
          <div class="random-empty">
            <i class="fas fa-feather"></i>
            <p>Aún no agregaste versículos propios.<br>Usa el formulario de arriba para comenzar.</p>
          </div>`;
        return;
    }

    ids.forEach(id => {
        renderSectionCard(wrap, id, sections[id], mySectionLabel(id), mySectionAbbr(id), 'Reiniciar progreso de esta sección');
    });
    ids.forEach(id => { updateBadge(id); updateVerseChipMastery(id); });
}

function toggleMonth(id) {
    const mc=document.getElementById(`mc-${id}`);
    const panel=document.getElementById(`panel-${id}`);
    if (mc.classList.contains('open')) {
        mc.classList.remove('open'); panel.classList.remove('visible');
        document.getElementById(`da-${id}`).innerHTML='';
    } else {
        mc.classList.add('open'); panel.classList.add('visible');
        renderCurrent(id);
    }
}

function renderCurrent(id) {
    const st=getState(id), da=document.getElementById(`da-${id}`);
    da.innerHTML='';
    updateVerseChipMastery(id);
    if (st.completed) { showFinal(id); updateQuickPicks(id,-1); return; }
    if (st.queue.length===0) { showCycleEnd(id); updateQuickPicks(id,-1); return; }

    const verses=getVerses(id);
    const vi=st.queue[0], v=verses[vi], level=practiceDifficulty;
    const n=verses.length, done=n-st.queue.length;
    const hasHidden=level>1;
    updateQuickPicks(id, vi);

    document.getElementById(`vc-${id}`).textContent=`Versículo ${done+1} de ${n}`;
    document.getElementById(`dp-${id}`).querySelectorAll('.diff-pip').forEach((p,i)=>{
        const lvl=i+1;
        p.classList.toggle('current', lvl===level);
        p.classList.toggle('mastered', !!st.mastered[vi][lvl]);
    });

    const card=document.createElement('div');
    card.className='verse-card'; card.setAttribute('data-card','1');
    card.innerHTML=`
      <span class="verse-reference">${v.reference}</span>
      <div class="verse-text-wrap">${buildVerseHTML(v.text, level)}</div>
      ${hasHidden?`<div class="hint-row">
        <span class="reveal-hint"><i class="fas fa-hand-pointer"></i> Toca cada espacio para revelar</span>
        <button class="btn-reveal-all" onclick="revealAll(this)"><i class="fas fa-eye"></i> Revelar todo</button>
      </div>`:''}`;
    da.appendChild(card);
    ctrlDisabled(id,false);
}

function mark(id, knew) {
    const st=getState(id);
    if (!st||st.queue.length===0) return;
    const vi=st.queue[0];
    if (knew) {
        st.nextLevel[vi]=Math.min(practiceDifficulty+1,LEVEL_MAX); st.cycleKnown++;
        st.mastered[vi][practiceDifficulty]=true;
    }
    else {
        st.nextLevel[vi]=1;
        st.mastered[vi][practiceDifficulty]=false;
    }
    // Alimenta Disponible/Aprendido/Repasar de Aleatorio: da igual el modo
    // (mes, Mis Versículos) o la dificultad — "Lo sé"/"No lo sé" cuenta acá.
    setVerseMark(id, vi, knew);
    ctrlDisabled(id,true);
    const card=document.getElementById(`da-${id}`)?.querySelector('.verse-card');
    const advance=()=>{ st.queue.shift(); renderCurrent(id); updateBadge(id); persistState(id); };
    if (card) { card.classList.add(knew?'slide-out-right':'slide-out-left'); card.addEventListener('animationend',advance,{once:true}); }
    else advance();
}

function showCycleEnd(id) {
    const st=getState(id), n=getVerses(id).length;
    const da=document.getElementById(`da-${id}`);
    da.innerHTML=''; ctrlDisabled(id,true);
    if (Object.values(st.curLevel).every(l=>l===LEVEL_MAX) && st.cycleKnown===n) {
        st.completed=true; updateBadge(id); persistState(id); showFinal(id); return;
    }
    const notKnown=n-st.cycleKnown;
    const div=document.createElement('div'); div.className='cycle-complete';
    div.innerHTML=`
      <div class="cc-icon"><i class="fas fa-flag-checkered"></i></div>
      <div class="cc-title">¡Ciclo completado!</div>
      <div class="cc-sub">Continúa para seguir avanzando.</div>
      <div class="cc-stats">
        <div class="cc-stat"><div class="stat-num good">${st.cycleKnown}</div><div class="stat-label">Lo supe</div></div>
        <div class="cc-stat"><div class="stat-num bad">${notKnown}</div><div class="stat-label">A repasar</div></div>
      </div>
      <button class="btn-continue" onclick="startNextCycle('${id}')">Continuar <i class="fas fa-arrow-right"></i></button>`;
    da.appendChild(div);
}

function startNextCycle(id) {
    const st=getState(id), n=getVerses(id).length;
    for (let i=0;i<n;i++) st.curLevel[i]=st.nextLevel[i];
    st.cycleKnown=0; st.queue=[...Array(n).keys()];
    renderCurrent(id); updateBadge(id); persistState(id);
}

function showFinal(id) {
    const da=document.getElementById(`da-${id}`);
    da.innerHTML=''; ctrlDisabled(id,true);
    const label = isMineId(id) ? 'Sección dominada' : 'Mes dominado';
    const div=document.createElement('div'); div.className='completion-message';
    div.innerHTML=`
      <div class="comp-icon">✦</div>
      <div class="comp-title">¡${label}!</div>
      <div class="comp-sub">Completaste los 4 niveles de memorización.<br>¡La Palabra vive en ti!</div>
      <button class="btn-repeat" onclick="repeatMonth('${id}')"><i class="fas fa-redo"></i> Volver a practicar</button>`;
    da.appendChild(div);
}

function repeatMonth(id) {
    const n=getVerses(id).length, curLevel={}, nextLevel={};
    for (let i=0;i<n;i++) curLevel[i]=nextLevel[i]=LEVEL_MAX;
    const mastered = getState(id).mastered; // conserva el detalle mastered[i][nivel] existente
    const newState = {queue:[...Array(n).keys()],curLevel,nextLevel,mastered,cycleKnown:0,completed:false};
    if (isMineId(id)) mySectionState[id]=newState; else monthState[id]=newState;
    updateBadge(id); renderCurrent(id); persistState(id);
}

function updateBadge(id) {
    const st=getState(id), n=getVerses(id).length;
    const mastered=Object.values(st.nextLevel).filter(l=>l>=LEVEL_MAX).length;
    const pf=document.getElementById(`pf-${id}`), ct=document.getElementById(`ct-${id}`);
    const doneLabel = isMineId(id) ? '✦ ¡Sección completada!' : '✦ ¡Mes completado!';
    if (pf) pf.style.width=st.completed?'100%':`${(mastered/n)*100}%`;
    if (ct) ct.textContent=st.completed?doneLabel:`${mastered} / ${n} dominados`;
}

function ctrlDisabled(id,dis) {
    const y=document.getElementById(`yes-${id}`), n=document.getElementById(`no-${id}`);
    if(y)y.disabled=dis; if(n)n.disabled=dis;
}

// ═══════════════════════════════════════════
// RANDOM PAGE
// ═══════════════════════════════════════════
function initRandomPage() {
    randomDifficulty = 3; // siempre arranca en Difícil; el usuario la puede cambiar
    randomFilter = 'disponible';
    // verseMarks ya está cargado desde el INIT general de la app (loadVerseMarks());
    // no hace falta releerlo acá — es el mismo store que alimentan Aprender/Mis Versículos.

    document.querySelectorAll('#difficulty-selector-random .diff-btn[data-level]')
        .forEach(b => b.classList.toggle('active', Number(b.dataset.level) === randomDifficulty));
    document.querySelectorAll('.rstat').forEach(el => {
        el.classList.toggle('active', el.dataset.filter === randomFilter);
    });

    buildRandomQueue();
    renderRandomStats();
    renderRandomVerse();
}

function renderRandomStats() {
    document.getElementById('rs-total').textContent      = getMarkedVerses(null).length;
    document.getElementById('rs-session-ok').textContent = getMarkedVerses('aprendido').length;
    document.getElementById('rs-session-no').textContent = getMarkedVerses('repasar').length;
}

function renderRandomVerse() {
    const area = document.getElementById('random-area');
    const pool = currentRandomPool();

    if (pool.length === 0) {
        area.innerHTML = `
          <div class="random-empty">
            <i class="fas fa-book"></i>
            <p>${randomEmptyMessage()}</p>
          </div>`;
        return;
    }

    if (randomPointer >= randomQueue.length) {
        // Reshuffled another round (con el pool actual, según el filtro activo)
        buildRandomQueue();
    }

    const item = randomQueue[randomPointer];
    const level = randomDifficulty;
    const hasHidden = level > 1;

    const wrap = document.createElement('div');
    wrap.className = 'random-card-wrap';
    wrap.innerHTML = `
      <div class="random-verse-card" data-card="1">
        <div class="random-month-chip"><i class="fas fa-calendar-alt"></i> ${item.monthName}</div>
        <span class="random-reference">${item.reference}</span>
        <div class="random-text">${buildVerseHTML(item.text, level)}</div>
        ${hasHidden?`<div class="random-hint-row">
          <span class="reveal-hint"><i class="fas fa-hand-pointer"></i> Toca cada espacio para revelar</span>
          <button class="btn-reveal-all" onclick="revealAll(this)"><i class="fas fa-eye"></i> Revelar todo</button>
        </div>`:''}
      </div>
      <div class="random-controls">
        <button class="dont-know" onclick="markRandom(false)"><i class="fas fa-times"></i> No lo sé</button>
        <button class="btn-next-random" onclick="markRandom(null)"><i class="fas fa-forward"></i> Saltar</button>
        <button class="know" onclick="markRandom(true)"><i class="fas fa-check"></i> Lo sé</button>
      </div>`;

    area.innerHTML = '';
    area.appendChild(wrap);
}

function markRandom(knew) {
    const item = randomQueue[randomPointer];
    if (item && knew !== null) {
        // Mismo store unificado que usan Aprender y Mis Versículos —
        // se guarda solo, sin botón "Guardar".
        setVerseMark(item.monthId, item.verseIdx, knew);
    }
    randomPointer++;
    renderRandomStats();

    const area  = document.getElementById('random-area');
    const card  = area.querySelector('.random-verse-card');
    const btns  = area.querySelectorAll('.random-controls button');
    btns.forEach(b => b.disabled = true);

    if (card && knew !== null) {
        card.style.transition = 'opacity 0.25s, transform 0.25s';
        card.style.opacity    = '0';
        card.style.transform  = knew ? 'translateX(40px) scale(0.97)' : 'translateX(-40px) scale(0.97)';
        setTimeout(renderRandomVerse, 280);
    } else {
        renderRandomVerse();
    }
}

// ═══════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════
function resetMonth(id) {
    const n = getVerses(id).length; // se lee ANTES de resetear, para limpiar sus marcas
    if (isMineId(id)) {
        // Reinicia SOLO esta sección: borra el progreso (por id) de sus
        // versículos, sin afectar a otros versículos propios ni a los meses.
        getVerses(id).forEach(v => { myProgress[v._uid] = makeVerseProgress(); });
        saveMyProgress();
        mySectionState[id] = makeMyState(id);
    } else {
        monthState[id] = makeState(id);
    }
    // También limpia las marcas de Disponible/Aprendido/Repasar de estos
    // versículos en Aleatorio, para no dejar un "Aprendido" fantasma sobre
    // un progreso que se acaba de borrar.
    for (let i = 0; i < n; i++) delete verseMarks[verseMarkKey(id, i)];
    saveVerseMarks();
    updateBadge(id);
    if (document.getElementById(`mc-${id}`)?.classList.contains('open')) renderCurrent(id);
    saveState();
}
// Nota: el reinicio "general" (todos los meses / toda Mis Versículos de una
// sola vez) se eliminó a propósito — cada tarjeta ya tiene su propio botón
// de reiniciar (ícono ↺ en el header), que cubre el mismo caso de uso con
// menos riesgo de un borrado accidental masivo y menos botones en pantalla.

// ═══════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════
function saveState() {
    try { localStorage.setItem('verso_v7', JSON.stringify(monthState)); } catch(e) {}
}
function loadState() {
    try {
        const raw=localStorage.getItem('verso_v7');
        if (!raw) return;
        const saved=JSON.parse(raw);
        for (const id in versesData) {
            if (!saved[id]) continue;
            monthState[id]=saved[id];
            const st=monthState[id];
            if (!st.mastered) { // progreso guardado antes de que existiera este campo
                st.mastered={};
                const n=versesData[id].length;
                for (let i=0;i<n;i++) st.mastered[i]={1:false,2:false,3:false};
            }
        }
    } catch(e) {}
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
for (const id in versesData) monthState[id]=makeState(id);
buildUI();
loadState();
loadMyVerses();
loadMyProgress();
loadVerseMarks();
buildMyUI();
try {
    const savedDiff = Number(localStorage.getItem('verso_difficulty'));
    if ([1,2,3].includes(savedDiff)) practiceDifficulty = savedDiff;
} catch(e) {}
document.querySelectorAll('.practice-diff-selector .diff-btn[data-level]')
    .forEach(b => b.classList.toggle('active', Number(b.dataset.level) === practiceDifficulty));
for (const id in versesData) { updateBadge(id); updateVerseChipMastery(id); }
</script>
