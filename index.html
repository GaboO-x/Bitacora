<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bitácora — Login</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bitácora" />
  <script type="module" src="./js/sw-update.js"></script>
  <script type="module" src="./js/install-button.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:32px;line-height:1.4;background:#fafafa}
    .wrap{max-width:760px;margin:0 auto}
    .card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:18px 18px 14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    h1{margin:0 0 10px;font-size:26px}
    h2{margin:18px 0 10px;font-size:16px}
    label{display:block;font-size:13px;color:#555;margin:10px 0 6px}
    input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button,a.btn{border:1px solid #ddd;background:#111;color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    button.secondary{background:#fff;color:#111}
    .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
    .msg.ok{display:block;background:#eefaf0;border:1px solid #bfe8c6;color:#0a3d12}
    .msg.err{display:block;background:#fff1f1;border:1px solid #f0b9b9;color:#5a0b0b}
    .muted{color:#666;font-size:13px;margin:10px 0 0}
    .hr{height:1px;background:#eee;margin:16px 0}
    code{background:#f6f6f6;padding:2px 6px;border-radius:6px}
    #installed-logo{display:flex;justify-content:center;padding:18px 0 8px}
    #installed-logo img{width:120px;height:120px;border-radius:28px}
    /* Campo de contraseña con botón mostrar/ocultar */
    .pw-wrap{position:relative}
    .pw-wrap input{padding-right:44px}
    .pw-toggle{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:34px;height:34px;padding:0;border:none;border-radius:8px;background:transparent;color:#666;cursor:pointer}
    .pw-toggle:hover{background:#f2f2f2;color:#111}
    .pw-toggle svg{width:20px;height:20px;display:block;margin:auto}
    button:disabled{opacity:.6;cursor:default}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="app-title">Bitácora</h1>
      <div id="install-button-anchor"></div>

      <div id="login-section" style="display:none">
      <div class="hr"></div>

      <div hidden>
      <h2>1) Configuración de Supabase</h2>
      <div class="row">
        <div>
          <label for="sbUrl">Project URL</label>
          <input id="sbUrl" placeholder="https://xxxx.supabase.co" autocomplete="off" />
        </div>
        <div>
          <label for="sbAnon">Publishable (anon) key</label>
          <input id="sbAnon" placeholder="sb_publishable_..." autocomplete="off" />
        </div>
      </div>
      <div class="btns">
        <button id="btnSave" class="secondary" type="button">Guardar configuración</button>
      </div>

      <div class="hr"></div>
    </div>

      <h2>Bienvenido Inicia sesión</h2>
      <div class="row">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" />
        </div>
        <div>
          <label for="pw">Contraseña</label>
          <div class="pw-wrap">
            <input id="pw" type="password" autocomplete="current-password" />
            <button id="btnTogglePw" class="pw-toggle" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña" aria-pressed="false"></button>
          </div>
        </div>
      </div>

      <div class="btns">
        <button id="btnLogin" type="button">Ingresar</button>
      </div>
      <!-- Contenedor de mensajes: setMsg("msg", ...) escribe acá. Antes no
           existía, por eso ningún mensaje (ni de error) se veía en pantalla. -->
      <div id="msg" class="msg" role="alert" aria-live="polite"></div>
      </div>

    </div>
  </div>

  <script type="module">
    import { getCfg, saveCfg, ensureSupabase, setMsg } from "./js/shared.js";

    const elUrl = document.getElementById("sbUrl");
    const elAnon = document.getElementById("sbAnon");
    const elEmail = document.getElementById("email");
    const elPw = document.getElementById("pw");

    function showOk(t){ setMsg("msg", t, false); }
    function showErr(t){ setMsg("msg", t, true); }

    // ---- Mostrar / ocultar contraseña ----
    const btnTogglePw = document.getElementById("btnTogglePw");
    const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const ICON_EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    function setPwVisible(visible){
      elPw.type = visible ? "text" : "password";
      btnTogglePw.innerHTML = visible ? ICON_EYE_OFF : ICON_EYE;
      const label = visible ? "Ocultar contraseña" : "Mostrar contraseña";
      btnTogglePw.setAttribute("aria-label", label);
      btnTogglePw.title = label;
      btnTogglePw.setAttribute("aria-pressed", visible ? "true" : "false");
    }
    setPwVisible(false);
    btnTogglePw.addEventListener("click", () => {
      setPwVisible(elPw.type === "password");
      elPw.focus();
    });

    // ---- Mensajes de error de Supabase Auth en español ----
    // Credenciales incorrectas siempre como "Usuario o Contraseña inválida"
    // (no se distingue si falló el usuario o la contraseña, a propósito).
    function loginErrorMessage(error){
      const code = error?.code || "";
      const msg = (error?.message || "").toLowerCase();
      if (!navigator.onLine || msg.includes("failed to fetch") || msg.includes("network")) {
        return "Sin conexión a internet. Revisá tu conexión e intentá de nuevo.";
      }
      if (code === "invalid_credentials" || msg.includes("invalid login credentials")) {
        return "Usuario o Contraseña inválida";
      }
      if (code === "email_not_confirmed" || msg.includes("email not confirmed")) {
        return "Tu cuenta todavía no está activada. Usá el link de invitación o pedí uno nuevo al administrador.";
      }
      if (code === "over_request_rate_limit" || error?.status === 429 || msg.includes("rate limit")) {
        return "Demasiados intentos seguidos. Esperá unos minutos e intentá de nuevo.";
      }
      if (code === "user_banned" || msg.includes("banned")) {
        return "Tu usuario está suspendido. Contactá al administrador.";
      }
      return "No se pudo iniciar sesión. Intentá de nuevo.";
    }

    function getNext(){
      const u = new URL(window.location.href);
      const next = (u.searchParams.get("next") || "").trim();
      return next || null;
    }

    function redirectAfterLogin(){
      const next = getNext();
      if (next) window.location.href = next;
      else window.location.href = "./app.html";
    }

    const cfg = getCfg();
    if (cfg?.url) elUrl.value = cfg.url;
    if (cfg?.anon) elAnon.value = cfg.anon;

    document.getElementById("btnSave").addEventListener("click", () => {
      const url = (elUrl.value || "").trim();
      const anon = (elAnon.value || "").trim();
      if (!url || !anon){
        showErr("Completa Project URL y Publishable key.");
        return;
      }
      saveCfg(url, anon);
      showOk("Configuración guardada.");
    });

    const btnLogin = document.getElementById("btnLogin");
    async function doLogin(){
      if (btnLogin.disabled) return; // evita doble envío
      const email = (elEmail.value || "").trim();
      const password = (elPw.value || "").trim();
      if (!email || !password){
        showErr("Completa email y contraseña.");
        return;
      }

      const supabase = await ensureSupabase();
      if (!supabase){
        showErr("Falta configuración de Supabase. Guarda Project URL y Publishable key primero.");
        return;
      }

      showOk("Iniciando sesión…");
      btnLogin.disabled = true;
      let error = null;
      try {
        ({ error } = await supabase.auth.signInWithPassword({ email, password }));
      } catch (e) {
        error = e;
      }
      if (error){
        btnLogin.disabled = false;
        showErr(loginErrorMessage(error));
        return;
      }

      showOk("Sesión iniciada. Redirigiendo…");
      setTimeout(redirectAfterLogin, 400);
    }

    btnLogin.addEventListener("click", doLogin);
    // Enter en Email o Contraseña también inicia sesión.
    [elEmail, elPw].forEach((el) => el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); doLogin(); }
    }));

    (async () => {
      // Si venimos de un logout, no auto-redirigir aunque exista sesión en caché.
      const u = new URL(window.location.href);
      if ((u.searchParams.get('loggedout') || '').trim() === '1') return;

      const supabase = await ensureSupabase();
      if (!supabase) return;

      // Sin conexión: no podemos validar la sesión contra el servidor
      // (getUser hace una llamada de red), pero si ya existe una sesión
      // guardada localmente (getSession, 100% local, sin red) la dejamos
      // pasar igual — la propia app.html ya maneja con calma cualquier
      // llamada que falle por falta de conexión una vez adentro. Sin este
      // fallback, cerrar la app y reabrirla sin señal dejaba a cualquiera
      // trabado en la pantalla de login para siempre, aunque su sesión
      // siguiera siendo válida.
      if (!navigator.onLine) {
        const { data: sessionData } = await supabase.auth.getSession();
        if (sessionData?.session) redirectAfterLogin();
        return;
      }

      // Con conexión: se sigue validando contra el servidor como antes
      // (evita bucles con sesiones viejas en caché que ya no son válidas).
      // Evita bucles: getSession puede devolver una sesión vieja en cache.
      // getUser valida con el servidor.
      const { data: userData, error } = await supabase.auth.getUser();
      if (!error && userData?.user) redirectAfterLogin();
    })();
  </script>
</body>
</html>
