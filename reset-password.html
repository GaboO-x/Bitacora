<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bitácora — Nueva contraseña</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:32px;line-height:1.4;background:#fafafa}
    .wrap{max-width:760px;margin:0 auto}
    .card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:18px 18px 14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    h1{margin:0 0 10px;font-size:26px}
    label{display:block;font-size:13px;color:#555;margin:10px 0 6px}
    input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button{border:1px solid #ddd;background:#111;color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
    .msg.ok{display:block;background:#eefaf0;border:1px solid #bfe8c6;color:#0a3d12}
    .msg.err{display:block;background:#fff1f1;border:1px solid #f0b9b9;color:#5a0b0b}
    .muted{color:#666;font-size:13px;margin:10px 0 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Bitácora</h1>
      <p class="muted" id="introMsg">Verificando el link de recuperación…</p>

      <div id="formWrap" style="display:none;">
        <label for="pw1">Nueva contraseña</label>
        <input id="pw1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />

        <label for="pw2">Confirmar contraseña</label>
        <input id="pw2" type="password" autocomplete="new-password" />

        <div class="btns">
          <button id="btnSave" type="button">Guardar nueva contraseña</button>
        </div>
      </div>

      <p id="msg" class="msg"></p>
    </div>
  </div>

  <script type="module">
    import { ensureSupabase, setMsg } from "./shared.js";

    const introMsg = document.getElementById("introMsg");
    const formWrap = document.getElementById("formWrap");
    const pw1 = document.getElementById("pw1");
    const pw2 = document.getElementById("pw2");
    const btnSave = document.getElementById("btnSave");

    function showOk(t) { setMsg("msg", t, false); }
    function showErr(t) { setMsg("msg", t, true); }

    (async () => {
      const supabase = await ensureSupabase();
      if (!supabase) {
        introMsg.textContent = "Falta configuración de Supabase.";
        return;
      }

      // El link de recuperación trae el token en el hash de la URL.
      // supabase-js lo detecta automáticamente y dispara PASSWORD_RECOVERY
      // al inicializar la sesión. Esperamos ese evento antes de mostrar el form.
      let resolved = false;

      supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          resolved = true;
          introMsg.textContent = "Ingresá tu nueva contraseña.";
          formWrap.style.display = "block";
        }
      });

      // Fallback: si ya había una sesión de recovery activa antes de que
      // se registre el listener (carga rápida), la detectamos igual.
      setTimeout(async () => {
        if (resolved) return;
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          introMsg.textContent = "Ingresá tu nueva contraseña.";
          formWrap.style.display = "block";
        } else {
          introMsg.textContent = "El link de recuperación no es válido o ya expiró. Pedí que te reenvíen el email.";
        }
      }, 1200);
    })();

    btnSave.addEventListener("click", async () => {
      const p1 = (pw1.value || "").trim();
      const p2 = (pw2.value || "").trim();

      if (p1.length < 6) {
        showErr("La contraseña debe tener al menos 6 caracteres.");
        return;
      }
      if (p1 !== p2) {
        showErr("Las contraseñas no coinciden.");
        return;
      }

      const supabase = await ensureSupabase();
      if (!supabase) {
        showErr("Falta configuración de Supabase.");
        return;
      }

      btnSave.disabled = true;
      const { error } = await supabase.auth.updateUser({ password: p1 });
      btnSave.disabled = false;

      if (error) {
        showErr(error.message || "No se pudo actualizar la contraseña.");
        return;
      }

      showOk("Contraseña actualizada. Redirigiendo al login…");
      await supabase.auth.signOut();
      setTimeout(() => { window.location.href = "./index.html"; }, 1200);
    });
  </script>
</body>
</html>
