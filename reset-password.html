<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bitácora — Contraseña</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bitácora" />
  <script type="module" src="./js/sw-update.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function(){
      try{
        var t = localStorage.getItem('bitacora_theme');
        if(t === 'dark' || t === 'light'){ document.documentElement.setAttribute('data-theme', t); }
      }catch(e){}
    })();
  </script>
  <style>
    .wrap{max-width:440px;margin:56px auto;padding:0 16px;}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button id="btnThemeToggle" class="theme-toggle" type="button" title="Cambiar tema">☾</button>
    </div>
    <div class="card">
      <h1 id="pageTitle">Bitácora</h1>
      <p class="muted" id="introMsg">Verificando el link…</p>

      <div id="formWrap" style="display:none;">
        <label for="pw1">Nueva contraseña</label>
        <input id="pw1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />

        <label for="pw2">Confirmar contraseña</label>
        <input id="pw2" type="password" autocomplete="new-password" />

        <div class="btns">
          <button id="btnSave" type="button">Guardar contraseña</button>
        </div>
      </div>

      <p id="msg" class="msg"></p>
    </div>
  </div>

  <script type="module">
    import { ensureSupabase, setMsg } from "./js/shared.js";

    const pageTitle = document.getElementById("pageTitle");
    const introMsg = document.getElementById("introMsg");
    const formWrap = document.getElementById("formWrap");
    const pw1 = document.getElementById("pw1");
    const pw2 = document.getElementById("pw2");
    const btnSave = document.getElementById("btnSave");

    function showOk(t) { setMsg("msg", t, false); }
    function showErr(t) { setMsg("msg", t, true); }

    function showForm(flowType) {
      if (flowType === "invite") {
        pageTitle.textContent = "Bienvenido/a a Bitácora";
        introMsg.textContent = "Tu cuenta está lista. Creá tu contraseña para activarla.";
      } else {
        pageTitle.textContent = "Bitácora";
        introMsg.textContent = "Ingresá tu nueva contraseña.";
      }
      formWrap.style.display = "block";
    }

    function showInvalidLink() {
      introMsg.textContent = "El link no es válido o ya fue usado. Pedí que te generen uno nuevo desde el panel de administración.";
    }

    (async () => {
      const supabase = await ensureSupabase();
      if (!supabase) {
        introMsg.textContent = "Falta configuración de Supabase.";
        return;
      }

      const params = new URL(window.location.href).searchParams;
      const tokenHash = params.get("token_hash");
      // type puede venir como "recovery" o "invite" (nuestro link propio);
      // GoTrue internamente trata "invite" como signup, ambos válidos para verifyOtp.
      const type = params.get("type");

      // --- Camino nuevo: link propio con token_hash+type, verificado explícitamente ---
      // Esto SOLO se ejecuta con la interacción real del navegador (nunca con un
      // simple GET de un bot/preview), porque el intercambio pasa por acá, no por
      // una URL "pelada" apuntando directo al endpoint de Supabase.
      if (tokenHash && type) {
        const { data, error } = await supabase.auth.verifyOtp({
          token_hash: tokenHash,
          type,
        });
        if (!error && data?.session) {
          showForm(type);
          return;
        }
        showInvalidLink();
        return;
      }

      // --- Fallback: links viejos (#access_token=...) generados antes de este fix ---
      let resolved = false;
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          resolved = true;
          showForm("recovery");
        }
      });

      setTimeout(async () => {
        if (resolved) return;
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          showForm("recovery");
        } else {
          showInvalidLink();
        }
      }, 1200);
    })();

    btnSave.addEventListener("click", async () => {
      const p1 = (pw1.value || "").trim();
      const p2 = (pw2.value || "").trim();

      if (p1.length < 6) {
        showErr("La contraseña debe tener al menos 6 caracteres.");
        return;
      }
      if (p1 !== p2) {
        showErr("Las contraseñas no coinciden.");
        return;
      }

      const supabase = await ensureSupabase();
      if (!supabase) {
        showErr("Falta configuración de Supabase.");
        return;
      }

      btnSave.disabled = true;
      const { error } = await supabase.auth.updateUser({ password: p1 });
      btnSave.disabled = false;

      if (error) {
        showErr(error.message || "No se pudo actualizar la contraseña.");
        return;
      }

      showOk("Contraseña actualizada. Redirigiendo al login…");
      await supabase.auth.signOut();
      setTimeout(() => { window.location.href = "./index.html"; }, 1200);
    });
  </script>
  <script>
    (function(){
      var btn = document.getElementById('btnThemeToggle');
      if(!btn) return;
      function current(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
      function updateIcon(){ btn.textContent = current() === 'dark' ? '☀' : '☾'; }
      btn.addEventListener('click', function(){
        var next = current() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try{ localStorage.setItem('bitacora_theme', next); }catch(e){}
        updateIcon();
      });
      updateIcon();
    })();
  </script>
</body>
</html>
